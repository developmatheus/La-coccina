# Deploy no Render: conecte o repo e use "Blueprint" ou crie Web Service manualmente.
# Variáveis com segredo: configure no painel Render (não commitar senhas).

services:
  - type: web
    name: la-coccina
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm run start:online
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: SERVE_FRONTEND
        value: "true"
      - key: NODE_VERSION
        value: "20"
      - key: PUBLIC_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_NAME
        sync: false
      - key: DB_SSL
        value: "true"
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: SESSION_SECRET
        sync: false
