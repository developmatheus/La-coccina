# Deploy no Render: conecte o repo e use "Blueprint" ou crie o Web Service manualmente.
# Este projeto usa backend Node + SQLite e serve o frontend estático pelo Express.
# Variáveis sensíveis devem ser configuradas no painel do Render, nunca commitadas.

services:
  - type: web
    name: la-coccina
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NODE_ENV
        value: production
      - key: SERVE_FRONTEND
        value: "true"
      - key: PUBLIC_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: DB_PATH
        sync: false
      - key: UPLOAD_DIR
        sync: false
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: GOOGLE_MAPS_API_KEY
        sync: false
