<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rastrear Pedido — La Coccina</title>
  <link rel="icon" type="image/png" sizes="32x32" href="ASSETS/imagens/favicon-32.png">
  <link rel="stylesheet" href="ASSETS/CSS/global.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    body { background: #0d0d0d; color: #fff; font-family: 'Inter', sans-serif; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px; }
    .track-box { background: #1a1a1a; border-radius: 20px; padding: 32px 28px; width: 100%; max-width: 480px; text-align: center; }
    .track-logo { font-family: 'SomeTimeLater', cursive; font-size: 2rem; color: #ffcc00; margin-bottom: 4px; }
    @font-face { font-family: 'SomeTimeLater'; src: url('ASSETS/fonts/Some Time Later.otf') format('opentype'); }
    .track-subtitle { color: #666; font-size: 0.82rem; margin-bottom: 28px; }

    /* Steps */
    .steps { display: flex; justify-content: space-between; align-items: flex-start; position: relative; margin: 28px 0; }
    .steps::before { content: ''; position: absolute; top: 18px; left: 0; right: 0; height: 2px; background: #2a2a2a; z-index: 0; }
    .step { display: flex; flex-direction: column; align-items: center; gap: 8px; position: relative; z-index: 1; flex: 1; }
    .step-dot { width: 36px; height: 36px; border-radius: 50%; background: #2a2a2a; border: 2px solid #333; display: flex; align-items: center; justify-content: center; font-size: 1rem; transition: all 0.4s; }
    .step-label { font-size: 0.65rem; color: #555; text-align: center; max-width: 70px; line-height: 1.3; transition: color 0.4s; }
    .step.done .step-dot { background: #1a3a2a; border-color: #27ae60; }
    .step.done .step-label { color: #4caf50; }
    .step.active .step-dot { background: #ffcc00; border-color: #ffcc00; box-shadow: 0 0 16px rgba(255,204,0,0.4); }
    .step.active .step-label { color: #ffcc00; font-weight: 600; }

    .track-status-label { font-size: 1.3rem; font-weight: 700; color: #fff; margin: 8px 0 4px; }
    .track-customer { color: #888; font-size: 0.85rem; margin-bottom: 20px; }
    .track-updated { color: #444; font-size: 0.72rem; }
    .track-refresh { color: #555; font-size: 0.75rem; margin-top: 16px; }

    /* Busca manual */
    .track-search { margin-top: 28px; border-top: 1px solid #222; padding-top: 24px; }
    .track-search p { color: #666; font-size: 0.82rem; margin-bottom: 10px; }
    .track-search-row { display: flex; gap: 8px; }
    .track-search-row input { flex: 1; background: #2a2a2a; border: 1px solid #333; color: #fff; border-radius: 8px; padding: 10px 14px; font-size: 0.9rem; }
    .track-search-row button { background: #ffcc00; color: #000; border: none; border-radius: 8px; padding: 10px 18px; font-weight: 700; cursor: pointer; white-space: nowrap; font-size: 0.9rem; }

    /* Histórico */
    .track-history { margin-top: 24px; border-top: 1px solid #222; padding-top: 16px; text-align: left; }
    .track-history h3 { font-size: 0.78rem; color: #555; text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 10px; }
    .track-history-item { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid #1a1a1a; cursor: pointer; }
    .track-history-item:last-child { border-bottom: none; }
    .track-history-item:hover .track-h-name { color: #ffcc00; }
    .track-h-name { font-size: 0.88rem; color: #ccc; }
    .track-h-date { font-size: 0.72rem; color: #444; }

    .btn-home { display: inline-block; margin-top: 20px; color: #555; font-size: 0.8rem; text-decoration: none; }
    .btn-home:hover { color: #ffcc00; }

    #error-msg { color: #e74c3c; font-size: 0.88rem; margin-top: 16px; display: none; }
  </style>
</head>
<body>
<div class="track-box">
  <div class="track-logo">La Coccina</div>
  <div class="track-subtitle">Acompanhe seu pedido em tempo real</div>

  <div id="track-result" style="display:none">
    <div class="steps" id="steps-bar"></div>
    <div class="track-status-label" id="track-status-label"></div>
    <div class="track-customer" id="track-customer"></div>
    <div class="track-updated" id="track-updated"></div>
    <div class="track-refresh" id="track-refresh-msg">Atualização automática ativa</div>
  </div>

  <div id="track-loading" style="color:#555; padding:20px 0">Carregando...</div>

  <p id="error-msg"></p>

  <div class="track-search">
    <p>Buscar outro pedido pelo código:</p>
    <div class="track-search-row">
      <input type="text" id="token-input" placeholder="Ex: 12-a3b4c5d6" maxlength="40">
      <button onclick="searchByToken()">Buscar</button>
    </div>
  </div>

  <div class="track-history" id="track-history" style="display:none">
    <h3>Pedidos recentes</h3>
    <div id="history-list"></div>
  </div>

  <a href="index.html" class="btn-home">← Voltar ao cardápio</a>
</div>

<script src="ASSETS/js/config.js"></script>
<script src="ASSETS/js/security.js"></script>
<script>
  const API = LaCoccinaSecurity.API_BASE;

  const STEPS = [
    { key: 'novo',             label: 'Recebido',  icon: '📋' },
    { key: 'em_producao',      label: 'Em preparo', icon: '👨‍🍳' },
    { key: 'aguardando_envio', label: 'Pronto',    icon: '✅' },
    { key: 'a_caminho',        label: 'A caminho', icon: '🛵' },
    { key: 'entregue',         label: 'Entregue',  icon: '🏠' },
  ];

  let currentToken = null;
  let sseConn = null;
  let pollTimer = null;

  function renderSteps(status) {
    const currentIdx = STEPS.findIndex(s => s.key === status);
    const bar = document.getElementById('steps-bar');
    bar.innerHTML = STEPS.map((s, i) => {
      const cls = i < currentIdx ? 'step done' : i === currentIdx ? 'step active' : 'step';
      return `<div class="${cls}"><div class="step-dot">${s.icon}</div><div class="step-label">${s.label}</div></div>`;
    }).join('');
  }

  function showOrder(data) {
    document.getElementById('track-loading').style.display = 'none';
    document.getElementById('error-msg').style.display = 'none';
    document.getElementById('track-result').style.display = 'block';
    renderSteps(data.status);
    document.getElementById('track-status-label').textContent = data.statusLabel;
    document.getElementById('track-customer').textContent = `Olá, ${data.customer} 👋`;
    document.getElementById('track-updated').textContent = `Atualizado: ${new Date(data.updatedAt).toLocaleString('pt-BR')}`;
  }

  async function fetchStatus(token) {
    try {
      const res = await fetch(`${API}/api/orders/track/${token}`);
      if (!res.ok) { showError('Pedido não encontrado.'); return; }
      const data = await res.json();
      showOrder(data);
    } catch {
      document.getElementById('track-refresh-msg').textContent = '⚠️ Sem conexão — tentando novamente...';
    }
  }

  function showError(msg) {
    document.getElementById('track-loading').style.display = 'none';
    document.getElementById('track-result').style.display = 'none';
    const el = document.getElementById('error-msg');
    el.textContent = msg;
    el.style.display = 'block';
  }

  function connectSSE(token) {
    if (sseConn) sseConn.close();
    sseConn = new EventSource(`${API}/api/products/stream`);
    sseConn.onmessage = (e) => {
      try {
        const d = JSON.parse(e.data);
        if (d.type === 'order-status-changed') fetchStatus(token);
      } catch {}
    };
    sseConn.onerror = () => {
      sseConn.close();
      // fallback polling a cada 15s
      clearInterval(pollTimer);
      pollTimer = setInterval(() => fetchStatus(token), 15000);
      document.getElementById('track-refresh-msg').textContent = '🔄 Verificando a cada 15s';
    };
    sseConn.onopen = () => {
      clearInterval(pollTimer);
      document.getElementById('track-refresh-msg').textContent = '🟢 Atualização automática ativa';
    };
  }

  function loadFromToken(token) {
    if (!token) return;
    currentToken = token;
    document.getElementById('track-loading').style.display = 'block';
    document.getElementById('track-result').style.display = 'none';
    document.getElementById('error-msg').style.display = 'none';
    fetchStatus(token);
    connectSSE(token);
  }

  function searchByToken() {
    const token = document.getElementById('token-input').value.trim();
    if (!token) return;
    window.history.replaceState(null, '', `?token=${encodeURIComponent(token)}`);
    loadFromToken(token);
  }

  function renderHistory() {
    const history = JSON.parse(localStorage.getItem('lc_orders') || '[]');
    if (!history.length) return;
    const block = document.getElementById('track-history');
    block.style.display = 'block';
    document.getElementById('history-list').innerHTML = history.map(o => `
      <div class="track-history-item" onclick="loadFromToken('${o.token}')">
        <div>
          <div class="track-h-name">Pedido #${o.id} — ${o.name}</div>
          <div class="track-h-date">${new Date(o.createdAt).toLocaleString('pt-BR')}</div>
        </div>
        <span style="color:#444; font-size:0.8rem">→</span>
      </div>
    `).join('');
  }

  // Init
  const params = new URLSearchParams(window.location.search);
  const tokenFromUrl = params.get('token');
  renderHistory();
  if (tokenFromUrl) {
    document.getElementById('token-input').value = tokenFromUrl;
    loadFromToken(tokenFromUrl);
  } else {
    document.getElementById('track-loading').style.display = 'none';
    // Carregar último pedido se houver
    const history = JSON.parse(localStorage.getItem('lc_orders') || '[]');
    if (history.length) loadFromToken(history[0].token);
  }
</script>
</body>
</html>
