<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acompanhar Pedido — La Coccina</title>
  <link rel="icon" type="image/png" sizes="32x32" href="ASSETS/imagens/favicon-32.png">
  <link rel="stylesheet" href="ASSETS/CSS/global.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    @font-face { font-family:'SomeTimeLater'; src:url('ASSETS/fonts/Some Time Later.otf') format('opentype'); }
    *, *::before, *::after { box-sizing: border-box; }
    body { background: #0d0d0d; color: #fff; font-family: 'Inter', sans-serif; min-height: 100vh; padding: 24px 16px 40px; }

    .page { max-width: 520px; margin: 0 auto; }

    /* Header */
    .track-brand { font-family: 'SomeTimeLater', cursive; font-size: 2rem; color: #ffcc00; text-align: center; margin-bottom: 2px; }
    .track-brand-tag { text-align: center; font-size: 0.72rem; color: #555; text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 28px; }

    /* Steps */
    .steps-wrap { background: #1a1a1a; border-radius: 16px; padding: 20px 16px 16px; margin-bottom: 16px; }
    .steps { display: flex; justify-content: space-between; align-items: flex-start; position: relative; margin-bottom: 16px; }
    .steps::before { content:''; position:absolute; top:18px; left:0; right:0; height:2px; background:#222; z-index:0; }
    .step { display:flex; flex-direction:column; align-items:center; gap:6px; position:relative; z-index:1; flex:1; }
    .step-dot { width:36px; height:36px; border-radius:50%; background:#222; border:2px solid #2a2a2a; display:flex; align-items:center; justify-content:center; font-size:1rem; transition:all 0.4s; }
    .step-label { font-size:0.62rem; color:#444; text-align:center; max-width:64px; line-height:1.3; transition:color 0.4s; }
    .step.done .step-dot { background:#1a3a2a; border-color:#27ae60; }
    .step.done .step-label { color:#4caf50; }
    .step.active .step-dot { background:#ffcc00; border-color:#ffcc00; box-shadow:0 0 18px rgba(255,204,0,0.35); }
    .step.active .step-label { color:#ffcc00; font-weight:700; }

    .track-status-label { font-size:1.2rem; font-weight:700; color:#fff; text-align:center; margin-bottom:4px; }
    .track-updated { font-size:0.72rem; color:#444; text-align:center; }

    /* Pulse indicator */
    .live-indicator { display:flex; align-items:center; justify-content:center; gap:6px; margin-top:10px; font-size:0.72rem; color:#555; }
    .live-dot { width:7px; height:7px; border-radius:50%; background:#555; animation:none; }
    .live-dot.active { background:#27ae60; animation:pulse 2s infinite; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }

    /* Resumo do pedido */
    .section { background:#1a1a1a; border-radius:16px; padding:18px 16px; margin-bottom:12px; }
    .section-title { font-size:0.65rem; color:#444; text-transform:uppercase; letter-spacing:0.1em; font-weight:700; margin-bottom:12px; }
    .info-row { display:flex; justify-content:space-between; gap:8px; font-size:0.85rem; margin-bottom:7px; }
    .info-row:last-child { margin-bottom:0; }
    .info-label { color:#555; flex-shrink:0; }
    .info-value { color:#ccc; text-align:right; word-break:break-word; }
    .info-value.gold { color:#ffcc00; font-weight:700; }

    .item-row { display:flex; gap:10px; padding:8px 0; border-bottom:1px solid #222; align-items:flex-start; }
    .item-row:last-child { border-bottom:none; }
    .item-qty { color:#ffcc00; font-weight:700; font-size:0.88rem; width:22px; flex-shrink:0; }
    .item-info { flex:1; }
    .item-name { font-size:0.88rem; color:#ddd; }
    .item-acc { font-size:0.75rem; color:#555; margin-top:2px; }
    .item-price { font-size:0.82rem; color:#888; white-space:nowrap; }

    /* Pagamento badge */
    .payment-badge { display:inline-block; background:#1e1e1e; border:1px solid #2a2a2a; border-radius:6px; padding:4px 12px; font-size:0.8rem; color:#bbb; }

    /* Busca manual */

    /* Nav */
    .nav-links { display:flex; gap:16px; justify-content:center; margin-top:20px; }
    .nav-links a { color:#444; font-size:0.78rem; text-decoration:none; }
    .nav-links a:hover { color:#ffcc00; }

    #error-msg { background:#1a0a0a; border:1px solid #3a1010; border-radius:12px; padding:16px; color:#e74c3c; font-size:0.88rem; text-align:center; margin-bottom:12px; display:none; }
  </style>
</head>
<body>
<div class="page">
  <div class="track-brand">La Coccina</div>
  <div class="track-brand-tag">Acompanhamento do Pedido</div>

  <!-- Status em tempo real -->
  <div class="steps-wrap" id="status-wrap" style="display:none">
    <div class="steps" id="steps-bar"></div>
    <div class="track-status-label" id="track-status-label"></div>
    <div class="track-updated" id="track-updated"></div>
    <div class="live-indicator">
      <div class="live-dot" id="live-dot"></div>
      <span id="live-label">Conectando...</span>
    </div>
  </div>

  <div id="track-loading" style="color:#555; text-align:center; padding:20px 0">Carregando...</div>
  <div id="error-msg"></div>

  <!-- Resumo do pedido (lido do localStorage) -->
  <div class="section" id="order-items-section" style="display:none">
    <div class="section-title">📋 Itens do Pedido</div>
    <div id="order-items-list"></div>
    <div class="info-row" style="margin-top:12px; padding-top:10px; border-top:1px solid #222;">
      <span class="info-label">Total</span>
      <span class="info-value gold" id="order-total"></span>
    </div>
  </div>

  <div class="section" id="order-info-section" style="display:none">
    <div class="section-title">📍 Dados do Pedido</div>
    <div class="info-row"><span class="info-label">Cliente</span><span class="info-value" id="sum-customer"></span></div>
    <div class="info-row"><span class="info-label">Endereço</span><span class="info-value" id="sum-address"></span></div>
    <div class="info-row"><span class="info-label">Telefone</span><span class="info-value" id="sum-phone"></span></div>
    <div class="info-row"><span class="info-label">Pagamento</span>
      <span class="info-value"><span class="payment-badge" id="sum-payment"></span></span>
    </div>
    <div class="info-row" id="sum-obs-row" style="display:none">
      <span class="info-label">Obs.</span>
      <span class="info-value" id="sum-obs" style="color:#888; font-style:italic"></span>
    </div>
  </div>

  <!-- Código do pedido (referência discreta) -->
  <div class="section" id="order-code-section" style="display:none">
    <div class="section-title">🔑 Código do pedido</div>
    <div style="display:flex; align-items:center; gap:10px;">
      <code id="order-code-display" style="flex:1; background:#0f0f0f; border:1px solid #1e1e1e; border-radius:8px; padding:10px 14px; font-size:0.85rem; color:#5ca8e0; word-break:break-all;"></code>
      <button onclick="copyOrderCode()" style="background:none; border:1px solid #2a2a2a; color:#666; border-radius:8px; padding:8px 12px; font-size:0.82rem; cursor:pointer; white-space:nowrap; width:auto; margin:0;" title="Copiar código">📋 Copiar</button>
    </div>
    <p style="font-size:0.72rem; color:#444; margin-top:6px;">Guarde este código para consultar seu pedido futuramente.</p>
  </div>

  <div class="nav-links">
    <a href="index.html">← Cardápio</a>
    <a href="cart.html">🛒 Carrinho</a>
  </div>
</div>

<script src="ASSETS/js/config.js"></script>
<script src="ASSETS/js/security.js"></script>
<script>
  const API = LaCoccinaSecurity.API_BASE;

  const STEPS = [
    { key: 'novo',             label: 'Recebido',   icon: '📋' },
    { key: 'em_producao',      label: 'Em preparo', icon: '👨‍🍳' },
    { key: 'aguardando_envio', label: 'Pronto',     icon: '✅' },
    { key: 'a_caminho',        label: 'A caminho',  icon: '🛵' },
    { key: 'entregue',         label: 'Entregue',   icon: '🏠' },
  ];

  const PAYMENT_LABELS = { pix: 'PIX', dinheiro: 'Dinheiro', cartao: 'Cartão' };

  let currentToken = null;
  let pollTimer    = null;
  let sseConn      = null;

  // ---- Renderização do status ----
  function renderSteps(status) {
    const idx = STEPS.findIndex(s => s.key === status);
    document.getElementById('steps-bar').innerHTML = STEPS.map((s, i) => {
      const cls = i < idx ? 'step done' : i === idx ? 'step active' : 'step';
      return `<div class="${cls}"><div class="step-dot">${s.icon}</div><div class="step-label">${s.label}</div></div>`;
    }).join('');
  }

  function showStatus(data) {
    document.getElementById('track-loading').style.display = 'none';
    document.getElementById('error-msg').style.display = 'none';
    document.getElementById('status-wrap').style.display = 'block';
    renderSteps(data.status);
    document.getElementById('track-status-label').textContent = data.statusLabel;
    document.getElementById('track-updated').textContent =
      `Atualizado: ${new Date(data.updatedAt + (data.updatedAt.includes('Z') ? '' : 'Z')).toLocaleString('pt-BR')}`;
  }

  function showError(msg) {
    document.getElementById('track-loading').style.display = 'none';
    document.getElementById('status-wrap').style.display = 'none';
    const el = document.getElementById('error-msg');
    el.textContent = msg;
    el.style.display = 'block';
  }

  function setLive(connected) {
    const dot   = document.getElementById('live-dot');
    const label = document.getElementById('live-label');
    dot.className   = connected ? 'live-dot active' : 'live-dot';
    label.textContent = connected ? '🟢 Atualizando a cada 10s' : '⚠️ Sem conexão — tentando reconectar...';
  }

  // ---- Fetch status ----
  async function fetchStatus(token) {
    try {
      const res = await fetch(`${API}/api/orders/track/${token}`);
      if (!res.ok) { showError('Pedido não encontrado. Verifique o código.'); stopPolling(); return; }
      const data = await res.json();
      showStatus(data);
      setLive(true);
    } catch {
      setLive(false);
    }
  }

  // ---- Polling fixo a cada 10s ----
  function startPolling(token) {
    stopPolling();
    pollTimer = setInterval(() => fetchStatus(token), 10000);
  }

  function stopPolling() {
    clearInterval(pollTimer);
    pollTimer = null;
  }

  // ---- SSE como canal prioritário (polling como fallback) ----
  function connectSSE(token) {
    if (sseConn) { sseConn.close(); sseConn = null; }
    sseConn = new EventSource(`${API}/api/products/stream`);
    sseConn.onopen = () => setLive(true);
    sseConn.onmessage = (e) => {
      try {
        const d = JSON.parse(e.data);
        if (d.type === 'order-status-changed') fetchStatus(token);
      } catch {}
    };
    sseConn.onerror = () => {
      sseConn.close(); sseConn = null;
      setLive(false);
    };
  }

  function loadFromToken(token) {
    if (!token) return;
    currentToken = token;
    document.getElementById('track-loading').style.display = 'block';
    document.getElementById('status-wrap').style.display = 'none';
    document.getElementById('error-msg').style.display = 'none';
    // Exibir código do pedido discretamente
    const codeSection = document.getElementById('order-code-section');
    const codeDisplay = document.getElementById('order-code-display');
    if (codeSection && codeDisplay) {
      codeDisplay.textContent = token;
      codeSection.style.display = 'block';
    }
    fetchStatus(token);
    startPolling(token);
    connectSSE(token);
  }

  function copyOrderCode() {
    const code = document.getElementById('order-code-display').textContent;
    navigator.clipboard.writeText(code).then(() => {
      const btn = event.currentTarget;
      btn.textContent = '✅ Copiado!';
      setTimeout(() => { btn.textContent = '📋 Copiar'; }, 2000);
    }).catch(() => {});
  }

  function showNoOrder() {
    document.getElementById('track-loading').style.display = 'none';
    const el = document.getElementById('error-msg');
    el.innerHTML = 'Nenhum pedido encontrado.<br><a href="index.html" style="color:#ffcc00; text-decoration:none; font-size:0.85rem; display:inline-block; margin-top:10px;">← Fazer um pedido</a>';
    el.style.display = 'block';
  }

  // ---- Resumo do pedido (localStorage) ----
  function renderOrderSummary() {
    const raw = localStorage.getItem('lc_last_order_summary');
    if (!raw) return;

    let s;
    try { s = JSON.parse(raw); } catch { return; }

    // Itens
    const itemsSec = document.getElementById('order-items-section');
    const itemsList = document.getElementById('order-items-list');
    if (s.items && s.items.length) {
      itemsList.innerHTML = s.items.map(i => {
        const acc = (i.accompaniments || []).map(a => a.name).join(', ');
        return `<div class="item-row">
          <div class="item-qty">${i.qty}×</div>
          <div class="item-info">
            <div class="item-name">${i.name}</div>
            ${acc ? `<div class="item-acc">↳ ${acc}</div>` : ''}
          </div>
          <div class="item-price">R$ ${(i.price * i.qty).toFixed(2)}</div>
        </div>`;
      }).join('');
      document.getElementById('order-total').textContent = `R$ ${parseFloat(s.total).toFixed(2)}`;
      itemsSec.style.display = 'block';
    }

    // Dados
    const infoSec = document.getElementById('order-info-section');
    document.getElementById('sum-customer').textContent = s.customer || '';
    document.getElementById('sum-address').textContent  = s.address  || '';
    document.getElementById('sum-phone').textContent    = s.phone    || '';
    document.getElementById('sum-payment').textContent  = PAYMENT_LABELS[s.payment] || s.payment || '';
    if (s.obs) {
      document.getElementById('sum-obs').textContent = s.obs;
      document.getElementById('sum-obs-row').style.display = 'flex';
    }
    if (s.customer || s.address) infoSec.style.display = 'block';
  }

  // ---- Init ----
  const params       = new URLSearchParams(window.location.search);
  const tokenFromUrl = params.get('token');

  renderOrderSummary();

  if (tokenFromUrl) {
    loadFromToken(tokenFromUrl);
  } else {
    // Tentar carregar último pedido do histórico local
    const history = JSON.parse(localStorage.getItem('lc_orders') || '[]');
    if (history.length && history[0].token) {
      loadFromToken(history[0].token);
    } else {
      showNoOrder();
    }
  }
</script>
</body>
</html>
