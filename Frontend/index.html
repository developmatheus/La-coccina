<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>La Coccina - Comida Caseira</title>

  <link rel="icon" type="image/png" sizes="32x32" href="ASSETS/imagens/favicon-32.png">

  <link rel="stylesheet" href="ASSETS/CSS/global.css">

  <style>
    .products-slider { position: relative; width: 100%; overflow: hidden; }
    .products-row { display: flex; gap: 25px; overflow-x: auto; overflow-y: hidden; width: 100%; padding: 20px 10px; -webkit-overflow-scrolling: touch; scrollbar-width: none; }
    .products-row::-webkit-scrollbar { display: none; }
    .card { min-width: 320px; width: 320px; flex: none; background: #1a1a1a; border-radius: 20px; overflow: hidden; transition: 0.3s; }

    /* Modal de seleção de acompanhamentos */
    #acc-sel-overlay {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,0.82); z-index: 2000;
      align-items: center; justify-content: center;
      padding: 20px;
    }
    #acc-sel-box {
      background: #1a1a1a; border-radius: 20px; padding: 28px;
      width: 100%; max-width: 440px; max-height: 80vh;
      overflow-y: auto; position: relative;
    }
    #acc-sel-box h3 { margin: 0 0 4px; font-size: 1.15rem; color: #fff; }
    #acc-sel-msg { color: #ffcc00; font-size: 0.85rem; margin-bottom: 14px; display: block; }
    #acc-sel-box .acc-actions { display: flex; gap: 10px; margin-top: 18px; }
    #acc-sel-box .acc-actions button { flex: 1; padding: 14px; border: none; border-radius: 50px; font-weight: bold; cursor: pointer; font-size: 1rem; }
    #btn-acc-confirm { background: #ffcc00; color: #000; }
    #btn-acc-cancel  { background: #333; color: #fff; }
  </style>

  <meta name="description" content="Marmitas caseiras deliciosas em Florianópolis. Comida feita com amor, ingredientes frescos e sabor autêntico. Entrega rápida em Cachoeira do Bom Jesus, Ingleses, Canasvieiras e região.">
  <meta name="keywords" content="marmita florianopolis, comida caseira florianopolis, marmita delivery floripa, almoço marmita, comida feita em casa, marmita cachoeira do bom jesus, marmita ingleses, marmita canasvieiras, la coccina, prato do dia florianopolis">

  <meta name="language" content="pt-BR">
  <meta name="author" content="La Coccina">
  <meta name="geo.region" content="BR-SC">
  <meta name="geo.placename" content="Florianópolis">
  <meta property="og:title" content="La Coccina - Marmitas Caseiras em Florianópolis">
  <meta property="og:description" content="Comida caseira deliciosa com entrega em Florianópolis. Marmitas, pratos do dia e muito sabor!">
  <meta property="og:image" content="https://developmatheus.github.io/La-coccina/Frontend/ASSETS/imagens/icons.png">
  <meta property="og:url" content="https://developmatheus.github.io/La-coccina/Frontend/index.html">
  <meta property="og:type" content="website">
</head>

<body>
  <header>
    <div class="logo">La Coccina</div>
  </header>

  <a href="admin/login.html" class="admin-btn">⚙️</a>

  <div id="status-bar"></div>

  <section class="hero">
    <div class="hero-layout">
      <div class="hero-left">
        <img src="ASSETS/imagens/Mascote 3.png" alt="La Coccina" class="hero-mascot">
        <h1 class="hero-title">Comida Caseira<br><span>Feita com Amor</span></h1>
        <button type="button" class="hero-cta" data-scroll-to="cardapio">Ver Cardápio</button>
      </div>

      <div id="daily-special-column" class="hero-daily">
        <div style="width:100%;">
          <h2 id="daily-title" style="display:none; color:#ffcc00; font-size: 2.3rem; margin-bottom: 15px; text-align:center;"></h2>
          <div id="daily-special" style="width:100%;"></div>
        </div>
      </div>
    </div>
  </section>

  <div class="menu-section" id="cardapio">
    <h2 class="section-title">🍲 Marmitas</h2>
    <div class="products-slider">
      <button type="button" class="slider-btn prev" data-slider="marmitas-grid" data-dir="-1" aria-label="Marmitas anteriores">❮</button>
      <div class="products-row" id="marmitas-grid"></div>
      <button type="button" class="slider-btn next" data-slider="marmitas-grid" data-dir="1" aria-label="Próximas marmitas">❯</button>
    </div>
  </div>

  <div class="menu-section">
    <h2 class="section-title">🥤 Bebidas</h2>
    <div class="products-slider">
      <button type="button" class="slider-btn prev" data-slider="bebidas-grid" data-dir="-1" aria-label="Bebidas anteriores">❮</button>
      <div class="products-row" id="bebidas-grid"></div>
      <button type="button" class="slider-btn next" data-slider="bebidas-grid" data-dir="1" aria-label="Próximas bebidas">❯</button>
    </div>
  </div>

  <div id="cart-float-btn" class="cart-float" onclick="checkCartBeforeOpen()" title="Carrinho">
    🛒 <span id="cart-count-float">0</span>
  </div>

  <script src="ASSETS/js/config.js"></script>
  <script src="ASSETS/js/security.js"></script>
  <script src="ASSETS/js/scroll-smooth.js"></script>
  <script src="ASSETS/js/script.js"></script>

  <script>
    const API_BASE = LaCoccinaSecurity.API_BASE;
    const esc = LaCoccinaSecurity.escapeHtml;
    const safeJson = LaCoccinaSecurity.safeJsonForHtml;
    const imgUrl = LaCoccinaSecurity.uploadUrl;
    let menuEventSource = null;
    let refreshDebounceTimer = null;
    let sseReconnectTimer = null;
    let fallbackPollTimer = null;
    let isRefreshing = false;

    function isActive(product) {
      return product.active === 1 || product.active === true;
    }

    async function fetchPublicMenu() {
      const res = await fetch(`${API_BASE}/api/products/menu`);
      if (!res.ok) throw new Error('Falha ao carregar cardápio');
      return res.json();
    }

    const REFRESH_DEBOUNCE_MS = Number(localStorage.getItem('lc_refresh_debounce') || 1000);

    function scheduleSiteRefresh() {
      clearTimeout(refreshDebounceTimer);
      refreshDebounceTimer = setTimeout(refreshSiteData, REFRESH_DEBOUNCE_MS);
    }

    // Polling de fallback: só agenda o próximo ciclo APÓS o atual terminar.
    // Evita sobreposição quando o SSE está indisponível.
    function scheduleFallbackPoll() {
      clearTimeout(fallbackPollTimer);
      fallbackPollTimer = setTimeout(async () => {
        await refreshSiteData();
        scheduleFallbackPoll();
      }, 60000);
    }

    async function refreshSiteData() {
      // Guard: se já está atualizando, ignora a chamada concurrent.
      if (isRefreshing) return;
      isRefreshing = true;
      try {
        const products = await fetchPublicMenu();
        renderMenu(products);
        renderDailySpecial(products);
        pruneInactiveFromCart(products);
        await updateClientStatusBar();
      } catch (e) {
        console.error('Erro ao atualizar site:', e);
      } finally {
        isRefreshing = false;
      }
    }

    function pruneInactiveFromCart(products) {
      const cart = JSON.parse(localStorage.getItem('cart') || '[]');
      if (!cart.length) return;
      const activeIds = new Set(products.map((p) => p.id));
      const filtered = cart.filter((item) => activeIds.has(item.id));
      if (filtered.length !== cart.length) {
        localStorage.setItem('cart', JSON.stringify(filtered));
        updateCartCount();
      }
    }

    function connectLiveUpdates() {
      if (menuEventSource) {
        menuEventSource.close();
        menuEventSource = null;
      }

      menuEventSource = new EventSource(`${API_BASE}/api/products/stream`);

      menuEventSource.onmessage = (event) => {
        try {
          const data = JSON.parse(event.data);
          if (data.type === 'connected') return;
          if (data.type === 'menu-updated' || data.type === 'status-updated') {
            scheduleSiteRefresh();
          }
        } catch {
          scheduleSiteRefresh();
        }
      };

      menuEventSource.onerror = () => {
        if (menuEventSource) {
          menuEventSource.close();
          menuEventSource = null;
        }
        // SSE caiu: ativa polling de fallback enquanto tenta reconectar.
        scheduleFallbackPoll();
        clearTimeout(sseReconnectTimer);
        sseReconnectTimer = setTimeout(connectLiveUpdates, 8000);
      };

      menuEventSource.onopen = () => {
        // SSE reconectou: cancela o polling de fallback.
        clearTimeout(fallbackPollTimer);
      };
    }

    function renderDailySpecial(products) {
      try {
        const daily = products.find(p => (p.isDailySpecial === true || p.isDailySpecial == 1) && isActive(p));
        const column = document.getElementById('daily-special-column');
        const title = document.getElementById('daily-title');
        const container = document.getElementById('daily-special');

        if (daily) {
          column.style.display = 'flex';
          title.style.display = 'block';
          const dailyBtn = `<button class="add-to-cart" onclick='addToCart(${safeJson(daily)})' style="background:#ffcc00;color:#000;padding:16px 40px;font-size:1.1rem;border:none;border-radius:50px;cursor:pointer;font-weight:bold;">Adicionar ao Carrinho</button>`;
          container.innerHTML = `
            <div style="background: #1a1a1a; border-radius: 24px; padding: 25px; box-shadow: 0 15px 35px rgba(0,0,0,0.6); max-width: 680px; margin: 0 auto; border: 1px solid #333;">
              <h2 style="color:#ffcc00; text-align:center; margin:0 0 18px 0; font-size:2.1rem;">🌟 Prato do Dia</h2>
              <img src="${imgUrl(daily.image)}" style="width:100%; max-height:420px; object-fit:cover; border-radius:18px; margin-bottom:20px; box-shadow:0 8px 20px rgba(0,0,0,0.5);">
              <h3 style="color:white; text-align:center; font-size:1.85rem; margin:15px 0 10px 0;">${esc(daily.name)}</h3>
              <p style="color:#ccc; text-align:center; line-height:1.6; font-size:1.08rem; margin-bottom:20px;">${esc(daily.desc || '')}</p>
              <div style="display:flex; align-items:center; justify-content:space-between; margin-top:10px; gap: 16px; flex-wrap: wrap;">
                <strong style="font-size:2.4rem; color:#ffcc00;">R$ ${parseFloat(daily.price).toFixed(2)}</strong>
                ${dailyBtn}
              </div>
            </div>`;
        } else {
          column.style.display = 'none';
          title.style.display = 'none';
          container.innerHTML = '';
        }
      } catch (e) {
        console.error('Erro no Prato do Dia:', e);
      }
    }

    function renderMenu(products) {
      try {
        const marmitasGrid = document.getElementById('marmitas-grid');
        const bebidasGrid = document.getElementById('bebidas-grid');
        marmitasGrid.innerHTML = '';
        bebidasGrid.innerHTML = '';

        products.filter(p => p.category === 'marmita' && isActive(p)).forEach(product => {
          marmitasGrid.appendChild(createCard(product));
        });

        products.filter(p => p.category === 'bebida' && isActive(p)).forEach(product => {
          bebidasGrid.appendChild(createCard(product));
        });
      } catch (e) {
        console.error('Erro ao carregar cardápio:', e);
      }
    }

    function buildDetailTags(product) {
      const d = product.details || {};
      const tags = [];
      if (product.category === 'marmita') {
        if (d.protein)         tags.push({ label: d.protein, color: '#c0392b' });
        if (d.is_customizable) tags.push({ label: '✏️ Personalizável', color: '#7d3c98' });
        else if (d.sides)      d.sides.split(',').forEach(s => s.trim() && tags.push({ label: s.trim(), color: '#2c7a4b' }));
      } else {
        if (d.volume)     tags.push({ label: d.volume,     color: '#1a6fa8' });
        if (d.serve_type) tags.push({ label: d.serve_type, color: '#6c3483' });
      }
      if (!tags.length) return '';
      return `<div class="product-tags">${tags.map(t =>
        `<span class="product-tag" style="background:${t.color}">${esc(t.label)}</span>`
      ).join('')}</div>`;
    }

    function createCard(product) {
      const card = document.createElement('div');
      card.className = 'card';
      const isCustomizable = product.details?.is_customizable;
      const cartButton = isCustomizable
        ? `<button class="add-to-cart" onclick='openAccompanimentsModal(${safeJson(product)})'>Personalizar e Adicionar</button>`
        : `<button class="add-to-cart" onclick='addToCart(${safeJson(product)}, [])'>Adicionar ao Carrinho</button>`;
      const imageHtml = product.image ? `<img src="${imgUrl(product.image)}" alt="${esc(product.name)}">` : '';
      card.innerHTML = `
        ${imageHtml}
        <div class="card-content">
          <h3>${esc(product.name)}</h3>
          ${buildDetailTags(product)}
          <p>${esc(product.desc || '')}</p>
          <strong>R$ ${parseFloat(product.price).toFixed(2)}</strong>
          ${cartButton}
        </div>`;
      return card;
    }

    // Modal de seleção de acompanhamentos (pratos personalizáveis)
    let _accModalProduct = null;

    async function openAccompanimentsModal(product) {
      if (!(await isStoreOpen())) { alert('🔴 O restaurante está fechado no momento.'); return; }
      _accModalProduct = product;

      document.getElementById('acc-sel-title').textContent = product.name;
      document.getElementById('acc-sel-list').innerHTML = '<p style="color:#888">Carregando...</p>';
      document.getElementById('acc-sel-msg').textContent = '';
      document.getElementById('acc-sel-overlay').style.display = 'flex';

      try {
        const res = await fetch(`${API_BASE}/api/accompaniments/product/${product.id}`);
        const items = await res.json();

        const cfg = items[0] || {};
        const min = cfg.min_sides || 0;
        const max = cfg.max_sides || 0;
        document.getElementById('acc-sel-msg').textContent =
          max > 0 ? `Escolha entre ${min} e ${max} acompanhamento(s).` : '';

        document.getElementById('acc-sel-list').innerHTML = items.length ? items.map(a => {
          const extraLabel = a.extra_price > 0 ? `<span style="color:#ffcc00; font-size:0.8rem"> +R$ ${parseFloat(a.extra_price).toFixed(2)}</span>` : '';
          return `
            <label style="display:flex; align-items:center; gap:10px; padding:10px 0; border-bottom:1px solid #2a2a2a; cursor:pointer;">
              <input type="checkbox" name="acc-sel" value="${a.id}"
                data-price="${a.extra_price}"
                data-name="${esc(a.name)}"
                ${a.is_default ? 'checked' : ''}>
              <span>${esc(a.name)}${extraLabel}</span>
            </label>`;
        }).join('') : '<p style="color:#888; font-size:0.9rem">Nenhum acompanhamento disponível.</p>';

        // Salvar config de min/max no elemento para usar no confirm
        document.getElementById('acc-sel-list').dataset.min = min;
        document.getElementById('acc-sel-list').dataset.max = max;
      } catch (e) {
        document.getElementById('acc-sel-list').innerHTML = '<p style="color:#e74c3c">Erro ao carregar opções.</p>';
      }
    }

    function confirmAccompaniments() {
      const list = document.getElementById('acc-sel-list');
      const min = Number(list.dataset.min || 0);
      const max = Number(list.dataset.max || 0);
      const checked = Array.from(list.querySelectorAll('input[name="acc-sel"]:checked'));

      if (max > 0 && (checked.length < min || checked.length > max)) {
        alert(`Escolha entre ${min} e ${max} acompanhamento(s). Você marcou ${checked.length}.`);
        return;
      }

      const selectedAcc = checked.map(cb => ({
        id: Number(cb.value),
        name: cb.dataset.name,
        extra_price: parseFloat(cb.dataset.price || 0),
      }));

      closeAccSel();
      addToCart(_accModalProduct, selectedAcc);
    }

    function closeAccSel() {
      document.getElementById('acc-sel-overlay').style.display = 'none';
      _accModalProduct = null;
    }

    async function isStoreOpen() {
      try {
        const res = await fetch(`${API_BASE}/api/products/status`);
        const data = await res.json();
        return data.isOpen;
      } catch {
        return false;
      }
    }

    function updateClientStatusBar() {
      const statusBar = document.getElementById('status-bar');
      return fetch(`${API_BASE}/api/products/status`)
        .then(res => res.json())
        .then(data => {
          if (data.isOpen) {
            statusBar.style.background = '#27ae60';
            statusBar.innerHTML = '🟢 Restaurante Aberto';
          } else {
            statusBar.style.background = '#e74c3c';
            statusBar.innerHTML = '🔴 Restaurante Fechado';
          }
        });
    }

    async function addToCart(product, selectedAcc = []) {
      if (!(await isStoreOpen())) {
        alert('🔴 O restaurante está fechado no momento.');
        return;
      }

      const extraPrice = selectedAcc.reduce((sum, a) => sum + (a.extra_price || 0), 0);
      const finalPrice = parseFloat(product.price) + extraPrice;

      // Cada combinação produto+acompanhamentos é tratada como item único no carrinho
      const accKey = selectedAcc.map(a => a.id).sort().join(',');
      const cartKey = `${product.id}:${accKey}`;

      let cart = JSON.parse(localStorage.getItem('cart')) || [];
      const existing = cart.find(item => item._cartKey === cartKey);

      if (existing) {
        existing.quantity = (existing.quantity || 1) + 1;
      } else {
        cart.push({
          ...product,
          price: finalPrice,
          _basePrice: product.price,
          _cartKey: cartKey,
          accompaniments: selectedAcc,
          quantity: 1,
        });
      }

      localStorage.setItem('cart', JSON.stringify(cart));
      updateCartCount();
      showToast(`✅ ${product.name} adicionado!`);
    }

    function updateCartCount() {
      const cart = JSON.parse(localStorage.getItem('cart')) || [];
      const count = cart.reduce((sum, item) => sum + (item.quantity || 1), 0);
      document.getElementById('cart-count-float').textContent = count;
    }

    function showToast(message) {
      const toast = document.createElement('div');
      toast.style = 'position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:#27ae60; color:white; padding:15px 30px; border-radius:50px; z-index:9999;';
      toast.textContent = message;
      document.body.appendChild(toast);
      setTimeout(() => toast.remove(), 1800);
    }

    function checkCartBeforeOpen() {
      const cart = JSON.parse(localStorage.getItem('cart')) || [];
      if (cart.length === 0) {
        alert('🛒 Seu carrinho está vazio!');
        return;
      }
      window.location.href = 'cart.html';
    }

    window.onload = () => {
      refreshSiteData();
      updateCartCount();
      connectLiveUpdates();
      scheduleFallbackPoll();
    };
  </script>

        <div style="display: flex; justify-content: center; gap: 25px; margin: 15px 0 12px 0;">
          <a href="https://www.instagram.com/lacoccinarestaurante/" target="_blank" style="color:white; text-decoration:none;">

  </footer>

  <!-- Modal de seleção de acompanhamentos -->
  <div id="acc-sel-overlay" onclick="if(event.target===this) closeAccSel()">
    <div id="acc-sel-box">
      <h3 id="acc-sel-title"></h3>
      <span id="acc-sel-msg"></span>
      <div id="acc-sel-list"></div>
      <div class="acc-actions">
        <button id="btn-acc-confirm" onclick="confirmAccompaniments()">✅ Adicionar ao Carrinho</button>
        <button id="btn-acc-cancel"  onclick="closeAccSel()">Cancelar</button>
      </div>
    </div>
  </div>
</body>
