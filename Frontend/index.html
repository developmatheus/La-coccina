<html lang="pt-BR">
<head>

  <style>
    .products-slider { position: relative; width: 100%; overflow: hidden; }
    .products-row { display: flex; gap: 25px; overflow-x: auto; overflow-y: hidden; width: 100%; padding: 20px 10px; -webkit-overflow-scrolling: touch; scrollbar-width: none; }
    .products-row::-webkit-scrollbar { display: none; }
    .card { min-width: 320px; width: 320px; flex: none; background: #1a1a1a; border-radius: 20px; overflow: hidden; transition: 0.3s; }

    /* Modal de seleção de acompanhamentos */
    #acc-sel-overlay {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,0.82); z-index: 2000;
      align-items: center; justify-content: center;
      padding: 20px;
    }
    #acc-sel-box {
      background: #1a1a1a; border-radius: 20px; padding: 0;
      width: 100%; max-width: 460px; max-height: 88vh;
      display: flex; flex-direction: column; position: relative;
      box-shadow: 0 24px 64px rgba(0,0,0,0.7);
    }
    .acc-modal-header {
      padding: 22px 24px 14px;
      border-bottom: 1px solid #2a2a2a;
    }
    .acc-modal-header h3 { margin: 0 0 2px; font-size: 1.1rem; color: #fff; }
    .acc-modal-header .acc-subtitle { color: #888; font-size: 0.82rem; margin: 0 0 8px; }
    .acc-counter-bar {
      display: flex; align-items: center; justify-content: space-between;
      background: #111; border-radius: 8px; padding: 8px 12px; margin-top: 8px;
    }
    .acc-counter-bar span { font-size: 0.85rem; color: #ccc; }
    .acc-counter-val { font-weight: 700; color: #ffcc00; font-size: 1rem; }
    .acc-counter-bar .acc-extra-total { color: #ffcc00; font-size: 0.85rem; font-weight: 600; }
    #acc-sel-list {
      overflow-y: auto; padding: 8px 0; flex: 1;
    }
    .acc-check-item {
      display: flex; align-items: center; gap: 14px;
      padding: 13px 24px; cursor: pointer;
      transition: background 0.15s;
      border-bottom: 1px solid #222;
    }
    .acc-check-item:last-child { border-bottom: none; }
    .acc-check-item:hover { background: #222; }
    .acc-check-item.is-selected { background: #1e2e1e; }
    .acc-check-item input[type=checkbox] { display: none; }
    .acc-checkmark {
      width: 22px; height: 22px; border-radius: 6px; flex-shrink: 0;
      border: 2px solid #444; display: flex; align-items: center; justify-content: center;
      transition: all 0.15s; background: #2a2a2a;
    }
    .acc-check-item.is-selected .acc-checkmark {
      background: #27ae60; border-color: #27ae60;
    }
    .acc-checkmark::after { content: '✓'; color: #fff; font-size: 0.85rem; display: none; }
    .acc-check-item.is-selected .acc-checkmark::after { display: block; }
    .acc-check-label { flex: 1; min-width: 0; }
    .acc-check-label strong { display: block; font-size: 0.95rem; color: #fff; font-weight: 500; }
    .acc-check-label .acc-price-tag {
      font-size: 0.78rem; color: #ffcc00; font-weight: 600; margin-top: 1px;
    }
    .acc-check-label .acc-default-tag {
      font-size: 0.7rem; background: #1a4a2a; color: #4caf50;
      padding: 1px 7px; border-radius: 50px; margin-left: 6px;
    }
    /* Controle de quantidade extra por acompanhamento */
    .acc-qty-wrap {
      display: flex; align-items: center; gap: 6px;
      margin-top: 6px;
      max-height: 0; overflow: hidden;
      transition: max-height 0.2s ease, opacity 0.2s ease;
      opacity: 0;
    }
    .acc-check-item.is-selected .acc-qty-wrap {
      max-height: 40px; opacity: 1;
    }
    .acc-qty-label { font-size: 0.7rem; color: #666; white-space: nowrap; }
    .acc-qty-btn {
      width: 26px; height: 26px; border-radius: 50%;
      border: 1.5px solid #3a3a3a; background: #222;
      color: #ccc; font-size: 1rem; line-height: 1;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      flex-shrink: 0; user-select: none;
    }
    .acc-qty-btn:hover { border-color: #ffcc00; color: #ffcc00; }
    .acc-qty-val { font-size: 0.9rem; font-weight: 700; color: #fff; min-width: 18px; text-align: center; }

    .acc-modal-footer {
      padding: 16px 24px;
      border-top: 1px solid #2a2a2a;
      display: flex; gap: 10px;
    }
    .acc-modal-footer button {
      flex: 1; padding: 14px; border: none; border-radius: 50px;
      font-weight: bold; cursor: pointer; font-size: 1rem; transition: opacity 0.2s;
    }
    #btn-acc-confirm { background: #ffcc00; color: #000; }
    #btn-acc-confirm:disabled { opacity: 0.45; cursor: not-allowed; }
    #btn-acc-cancel  { background: #2a2a2a; color: #fff; flex: 0 0 auto; padding: 14px 22px; }
  </style>

<body>
  <header>
    <div class="logo">

  </header>

  <a href="admin/login.html" class="admin-btn">⚙️</a>
  <a href="track.html" id="track-btn" title="Rastrear meu pedido" style="display:none; position:fixed; bottom:6rem; right:1.5rem; background:#1a2a3a; color:#5dade2; border:1px solid #1e3a5a; border-radius:50px; padding:0.55rem 1rem; font-size:0.78rem; font-weight:600; text-decoration:none; z-index:999; box-shadow:0 4px 16px rgba(0,0,0,0.4);">🔍 Pedido</a>

  <div class="menu-section" id="cardapio">

      <button type="button" class="slider-btn prev" data-slider="bebidas-grid" data-dir="-1" aria-label="Bebidas anteriores">❮</button>
      <div class="products-row" id="bebidas-grid"></div>
      <button type="button" class="slider-btn next" data-slider="bebidas-grid" data-dir="1" aria-label="Próximas bebidas">❯</button>

  <div id="cart-float-btn" class="cart-float" onclick="checkCartBeforeOpen()" title="Carrinho">
    🛒 <span id="cart-count-float">0</span>
  </div>

  <script src="ASSETS/js/config.js"></script>
  <script src="ASSETS/js/security.js"></script>
  <script src="ASSETS/js/scroll-smooth.js"></script>
  <script src="ASSETS/js/script.js"></script>

  <script>
    const API_BASE = LaCoccinaSecurity.API_BASE;
    const esc = LaCoccinaSecurity.escapeHtml;
    const safeJson = LaCoccinaSecurity.safeJsonForHtml;
    const imgUrl = LaCoccinaSecurity.uploadUrl;
    let menuEventSource = null;
    let refreshDebounceTimer = null;
    let sseReconnectTimer = null;
    let fallbackPollTimer = null;
    let isRefreshing = false;

    function isActive(product) {
      return product.active === 1 || product.active === true;
    }

    async function fetchPublicMenu() {
      const res = await fetch(`${API_BASE}/api/products/menu`);
      if (!res.ok) throw new Error('Falha ao carregar cardápio');
      return res.json();
    }

    const REFRESH_DEBOUNCE_MS = Number(localStorage.getItem('lc_refresh_debounce') || 1000);

    function scheduleSiteRefresh() {
      clearTimeout(refreshDebounceTimer);
      refreshDebounceTimer = setTimeout(refreshSiteData, REFRESH_DEBOUNCE_MS);
    }

    // Polling de fallback: só agenda o próximo ciclo APÓS o atual terminar.
    // Evita sobreposição quando o SSE está indisponível.
    function scheduleFallbackPoll() {
      clearTimeout(fallbackPollTimer);
      fallbackPollTimer = setTimeout(async () => {
        await refreshSiteData();
        scheduleFallbackPoll();
      }, 60000);
    }

    async function refreshSiteData() {
      // Guard: se já está atualizando, ignora a chamada concurrent.
      if (isRefreshing) return;
      isRefreshing = true;
      try {
        const products = await fetchPublicMenu();
        renderMenu(products);
        renderDailySpecial(products);
        pruneInactiveFromCart(products);
        await updateClientStatusBar();
      } catch (e) {
        console.error('Erro ao atualizar site:', e);
      } finally {
        isRefreshing = false;
      }
    }

    function pruneInactiveFromCart(products) {
      const cart = JSON.parse(localStorage.getItem('cart') || '[]');
      if (!cart.length) return;
      const activeIds = new Set(products.map((p) => p.id));
      const filtered = cart.filter((item) => activeIds.has(item.id));
      if (filtered.length !== cart.length) {
        localStorage.setItem('cart', JSON.stringify(filtered));
        updateCartCount();
      }
    }

    function connectLiveUpdates() {
      if (menuEventSource) {
        menuEventSource.close();
        menuEventSource = null;
      }

      menuEventSource = new EventSource(`${API_BASE}/api/products/stream`);

      menuEventSource.onmessage = (event) => {
        try {
          const data = JSON.parse(event.data);
          if (data.type === 'connected') return;
          if (data.type === 'menu-updated' || data.type === 'status-updated') {
            scheduleSiteRefresh();
          }
        } catch {
          scheduleSiteRefresh();
        }
      };

      menuEventSource.onerror = () => {
        if (menuEventSource) {
          menuEventSource.close();
          menuEventSource = null;
        }
        // SSE caiu: ativa polling de fallback enquanto tenta reconectar.
        scheduleFallbackPoll();
        clearTimeout(sseReconnectTimer);
        sseReconnectTimer = setTimeout(connectLiveUpdates, 8000);
      };

      menuEventSource.onopen = () => {
        // SSE reconectou: cancela o polling de fallback.
        clearTimeout(fallbackPollTimer);
      };
    }

    function renderDailySpecial(products) {
      try {
        const daily = products.find(p => (p.isDailySpecial === true || p.isDailySpecial == 1) && isActive(p));
        const column = document.getElementById('daily-special-column');
        const title = document.getElementById('daily-title');
        const container = document.getElementById('daily-special');

        if (daily) {
          column.style.display = 'flex';
          title.style.display = 'block';
          const isCustomizable = daily.details?.is_customizable;
          const dailyBtnAction = isCustomizable
            ? `openAccompanimentsModal(${safeJson(daily)})`
            : `addToCart(${safeJson(daily)}, [])`;
          const dailyBtnLabel = isCustomizable ? 'Personalizar e Adicionar' : 'Adicionar ao Carrinho';
          const dailyBtn = `<button class="add-to-cart daily-special-button" onclick='${dailyBtnAction}'>${dailyBtnLabel}</button>`;
          container.innerHTML = `
            <div class="daily-special-box">
              <h2 class="daily-special-heading">🌟 Prato do Dia</h2>
              <img src="${imgUrl(daily.image)}" alt="${esc(daily.name)}">
              <h3 class="daily-special-name">${esc(daily.name)}</h3>
              <p class="daily-special-description">${esc(daily.desc || '')}</p>
              <div class="daily-special-actions">
                <strong class="daily-special-price">R$ ${parseFloat(daily.price).toFixed(2)}</strong>
                ${dailyBtn}
              </div>
            </div>`;
        } else {
          column.style.display = 'none';
          title.style.display = 'none';
          container.innerHTML = '';
        }
      } catch (e) {
        console.error('Erro no Prato do Dia:', e);
      }
    }

    function renderMenu(products) {
      try {
        const marmitasGrid = document.getElementById('marmitas-grid');
        const bebidasGrid = document.getElementById('bebidas-grid');
        marmitasGrid.innerHTML = '';
        bebidasGrid.innerHTML = '';

        products.filter(p => p.category === 'marmita' && isActive(p)).forEach(product => {
          marmitasGrid.appendChild(createCard(product));
        });

        products.filter(p => p.category === 'bebida' && isActive(p)).forEach(product => {
          bebidasGrid.appendChild(createCard(product));
        });
      } catch (e) {
        console.error('Erro ao carregar cardápio:', e);
      }
    }

    function buildDetailTags(product) {
      const d = product.details || {};
      const tags = [];
      if (product.category === 'marmita') {
        if (d.protein)         tags.push({ label: d.protein, color: '#c0392b' });
        if (d.is_customizable) tags.push({ label: '✏️ Personalizável', color: '#7d3c98' });
        else if (d.sides)      d.sides.split(',').forEach(s => s.trim() && tags.push({ label: s.trim(), color: '#2c7a4b' }));
      } else {
        if (d.volume)     tags.push({ label: d.volume,     color: '#1a6fa8' });
        if (d.serve_type) tags.push({ label: d.serve_type, color: '#6c3483' });
      }
      if (!tags.length) return '';
      return `<div class="product-tags">${tags.map(t =>
        `<span class="product-tag" style="background:${t.color}">${esc(t.label)}</span>`
      ).join('')}</div>`;
    }

    function createCard(product) {
      const card = document.createElement('div');
      card.className = 'card';
      const isCustomizable = product.details?.is_customizable;
      const cartButton = isCustomizable
        ? `<button class="add-to-cart" onclick='openAccompanimentsModal(${safeJson(product)})'>Personalizar e Adicionar</button>`
        : `<button class="add-to-cart" onclick='addToCart(${safeJson(product)}, [])'>Adicionar ao Carrinho</button>`;
      const imageHtml = product.image ? `<img src="${imgUrl(product.image)}" alt="${esc(product.name)}">` : '';
      card.innerHTML = `
        ${imageHtml}
        <div class="card-content">
          <h3>${esc(product.name)}</h3>
          ${buildDetailTags(product)}
          <p>${esc(product.desc || '')}</p>
          <strong>R$ ${parseFloat(product.price).toFixed(2)}</strong>
          ${cartButton}
        </div>`;
      return card;
    }

    // Modal de seleção de acompanhamentos (pratos personalizáveis)
    let _accModalProduct = null;

    let _accModalMin = 0;
    let _accModalMax = 0;

    async function openAccompanimentsModal(product) {
      if (!(await isStoreOpen())) { alert('🔴 O restaurante está fechado no momento.'); return; }
      _accModalProduct = product;

      document.getElementById('acc-sel-title').textContent = product.name;
      document.getElementById('acc-sel-subtitle').textContent = product.desc || '';
      document.getElementById('acc-sel-list').innerHTML = '<p style="padding:24px; color:#888">Carregando...</p>';
      document.getElementById('acc-sel-overlay').style.display = 'flex';
      document.getElementById('btn-acc-confirm').disabled = true;

      try {
        const res = await fetch(`${API_BASE}/api/accompaniments/product/${product.id}`);
        const items = await res.json();

        const cfg = items[0] || {};
        _accModalMin = cfg.min_sides || 0;
        _accModalMax = cfg.max_sides || 0;

        document.getElementById('acc-sel-list').dataset.min = _accModalMin;
        document.getElementById('acc-sel-list').dataset.max = _accModalMax;

        if (!items.length) {
          document.getElementById('acc-sel-list').innerHTML =
            '<p style="padding:24px; color:#888; font-size:0.9rem">Nenhum acompanhamento disponível para este prato.</p>';
          _updateAccCounter();
          return;
        }

        document.getElementById('acc-sel-list').innerHTML = items.map(a => {
          const priceTag = a.extra_price > 0
            ? `<span class="acc-price-tag">+ R$ ${parseFloat(a.extra_price).toFixed(2)}</span>`
            : '';
          const defaultTag = a.is_default
            ? `<span class="acc-default-tag">padrão</span>` : '';
          return `
            <div class="acc-check-item${a.is_default ? ' is-selected' : ''}"
                 data-id="${a.id}"
                 data-price="${a.extra_price}"
                 data-name="${esc(a.name)}"
                 data-selected="${a.is_default ? '1' : '0'}"
                 data-extraqty="0">
              <div class="acc-checkmark" onclick="_toggleAccItem(this.parentElement)"></div>
              <div class="acc-check-label">
                <strong onclick="_toggleAccItem(this.closest('.acc-check-item'))">${esc(a.name)}${defaultTag}</strong>
                <div class="acc-qty-wrap">
                  <span class="acc-qty-label">+ extra${a.extra_price > 0 ? ` (R$&nbsp;${parseFloat(a.extra_price).toFixed(2)}/un)` : ' (incluso)'}:</span>
                  <button type="button" class="acc-qty-btn" onclick="_accQtyChange(this.closest('.acc-check-item'), -1)">−</button>
                  <span class="acc-qty-val">0</span>
                  <button type="button" class="acc-qty-btn" onclick="_accQtyChange(this.closest('.acc-check-item'), 1)">+</button>
                </div>
              </div>
            </div>`;
        }).join('');

        _updateAccCounter();
      } catch (e) {
        document.getElementById('acc-sel-list').innerHTML =
          '<p style="padding:24px; color:#e74c3c">Erro ao carregar opções.</p>';
      }
    }

    function _toggleAccItem(el) {
      const isSelected = el.dataset.selected === '1';
      el.dataset.selected = isSelected ? '0' : '1';
      el.classList.toggle('is-selected', !isSelected);
      if (isSelected) {
        // Ao desmarcar: zera extras
        el.dataset.extraqty = '0';
        const valEl = el.querySelector('.acc-qty-val');
        if (valEl) valEl.textContent = '0';
      }
      _updateAccCounter();
    }

    function _accQtyChange(el, delta) {
      // extraqty = porções ADICIONAIS além da 1ª inclusa
      const current = parseInt(el.dataset.extraqty || '0');
      const next = Math.max(0, current + delta);
      el.dataset.extraqty = String(next);
      const valEl = el.querySelector('.acc-qty-val');
      if (valEl) valEl.textContent = next;
      _updateAccCounter();
    }

    function _updateAccCounter() {
      const selectedEls = Array.from(document.querySelectorAll('.acc-check-item[data-selected="1"]'));
      // Min/max baseado em itens DISTINTOS selecionados
      const count = selectedEls.length;
      // Extra total: itens com extra_price * (qty - 1) unidades extras, mais o preço base × qty
      const extraTotal = selectedEls.reduce((s, el) => {
        const qty      = parseInt(el.dataset.qty || '1');
        const price    = parseFloat(el.dataset.price || 0);
        const extraQty = parseInt(el.dataset.extraqty || '0');
        // 1ª unidade gratuita (inclusa), cada adicional tem preço extra
        return s + price * extraQty;
      }, 0);

      const min = _accModalMin, max = _accModalMax;
      const hasLimit = max > 0;

      let label = `${count} selecionado${count !== 1 ? 's' : ''}`;
      if (hasLimit) label += ` de ${max}`;
      // Mostrar extras se houver qty > 1
      const extrasCount = selectedEls.reduce((s, el) => s + parseInt(el.dataset.extraqty || '0'), 0);
      if (extrasCount > 0) label += ` · ${extrasCount} extra${extrasCount !== 1 ? 's' : ''}`;
      document.getElementById('acc-count-label').textContent = label;

      const extraEl = document.getElementById('acc-extra-label');
      extraEl.textContent = extraTotal > 0 ? `+ R$ ${extraTotal.toFixed(2)}` : '';

      const hint = document.getElementById('acc-limit-hint');
      if (hasLimit) {
        hint.textContent = `Mín: ${min} · Máx: ${max}`;
        hint.style.color = (count < min || count > max) ? '#e74c3c' : '#4caf50';
      } else {
        hint.textContent = 'Selecione à vontade';
        hint.style.color = '#888';
      }

      const confirmBtn = document.getElementById('btn-acc-confirm');
      const valid = !hasLimit || (count >= min && count <= max);
      confirmBtn.disabled = !valid;

      const base = parseFloat(_accModalProduct?.price || 0);
      const total = base + extraTotal;
      confirmBtn.textContent = valid
        ? `✅ Adicionar — R$ ${total.toFixed(2)}`
        : `Escolha entre ${min} e ${max}`;
    }

    function confirmAccompaniments() {
      const selected = Array.from(document.querySelectorAll('.acc-check-item[data-selected="1"]'));
      // Cada item selecionado entra uma vez (1ª porção, inclusa).
      // Se extraqty > 0, adiciona entradas extras com o preço por unidade adicional.
      const selectedAcc = [];
      selected.forEach(el => {
        const extraQty   = parseInt(el.dataset.extraqty || '0');
        const extraPrice = parseFloat(el.dataset.price || 0);
        selectedAcc.push({
          id:          Number(el.dataset.id),
          name:        el.dataset.name,
          extra_price: 0, // 1ª porção sempre inclusa
        });
        for (let i = 0; i < extraQty; i++) {
          selectedAcc.push({
            id:          Number(el.dataset.id),
            name:        `${el.dataset.name} (extra)`,
            extra_price: extraPrice,
          });
        }
      });
      // Capturar o produto ANTES de fechar o modal (closeAccSel zera _accModalProduct)
      const product = _accModalProduct;
      closeAccSel();
      addToCart(product, selectedAcc);
    }

    function closeAccSel() {
      document.getElementById('acc-sel-overlay').style.display = 'none';
      _accModalProduct = null;
    }

    async function isStoreOpen() {
      try {
        const res = await fetch(`${API_BASE}/api/products/status`);
        const data = await res.json();
        return data.isOpen;
      } catch {
        return false;
      }
    }

    function updateClientStatusBar() {
      const statusBar = document.getElementById('status-bar');
      return fetch(`${API_BASE}/api/products/status`)
        .then(res => res.json())
        .then(data => {
          if (data.isOpen) {
            statusBar.style.background = '#27ae60';
            statusBar.innerHTML = '🟢 Restaurante Aberto';
          } else {
            statusBar.style.background = '#e74c3c';
            statusBar.innerHTML = '🔴 Restaurante Fechado';
          }
        });
    }

    async function addToCart(product, selectedAcc = []) {
      if (!(await isStoreOpen())) {
        alert('🔴 O restaurante está fechado no momento.');
        return;
      }

      const extraPrice = selectedAcc.reduce((sum, a) => sum + (a.extra_price || 0), 0);
      const finalPrice = parseFloat(product.price) + extraPrice;

      // Cada combinação produto+acompanhamentos é tratada como item único no carrinho
      const accKey = selectedAcc.map(a => a.id).sort().join(',');
      const cartKey = `${product.id}:${accKey}`;

      let cart = JSON.parse(localStorage.getItem('cart')) || [];
      const existing = cart.find(item => item._cartKey === cartKey);

      if (existing) {
        existing.quantity = (existing.quantity || 1) + 1;
      } else {
        cart.push({
          ...product,
          price: finalPrice,
          _basePrice: product.price,
          _cartKey: cartKey,
          accompaniments: selectedAcc,
          quantity: 1,
        });
      }

      localStorage.setItem('cart', JSON.stringify(cart));
      updateCartCount();
      showToast(`✅ ${product.name} adicionado!`);
    }

    function updateCartCount() {
      const cart = JSON.parse(localStorage.getItem('cart')) || [];
      const count = cart.reduce((sum, item) => sum + (item.quantity || 1), 0);
      document.getElementById('cart-count-float').textContent = count;
    }

    function showToast(message) {
      const toast = document.createElement('div');
      toast.style = 'position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:#27ae60; color:white; padding:15px 30px; border-radius:50px; z-index:9999;';
      toast.textContent = message;
      document.body.appendChild(toast);
      setTimeout(() => toast.remove(), 1800);
    }

    function checkCartBeforeOpen() {
      const cart = JSON.parse(localStorage.getItem('cart')) || [];
      if (cart.length === 0) {
        alert('🛒 Seu carrinho está vazio!');
        return;
      }
      window.location.href = 'cart.html';
    }

    window.onload = () => {
      refreshSiteData();
      updateCartCount();
      connectLiveUpdates();
      scheduleFallbackPoll();
      // Mostrar botão de rastreio se houver pedido recente (últimas 4h)
      const orders = JSON.parse(localStorage.getItem('lc_orders') || '[]');
      const recent = orders.find(o => Date.now() - o.createdAt < 4 * 60 * 60 * 1000);
      if (recent) {
        const btn = document.getElementById('track-btn');
        btn.style.display = 'flex';
        btn.href = `track.html?token=${recent.token}`;
      }
    };
  </script>
