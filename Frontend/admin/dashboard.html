<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel Admin - La Coccina</title>
  <link rel="icon" type="image/png" sizes="32x32" href="../assets/imagens/favicon-32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="../assets/imagens/favicon-192.png">
  <link rel="apple-touch-icon" href="../assets/imagens/apple-touch-icon.png">
  <link rel="stylesheet" href="../assets/CSS/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>

  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdnjs.cloudflare.com 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com; img-src 'self' https: data: blob:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self';">

  <style>
    .admin-panel { padding: 30px; max-width: 1250px; margin: 0 auto; }
    .admin-header { background: #1a1a1a; padding: 20px; border-radius: 12px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 35px; }
    .admin-header h1 { margin: 0; font-size: 1.35rem; }
    .grid-admin { display: grid; grid-template-columns: 1fr 2fr; gap: 30px; }
    .card-admin { background: #1a1a1a; padding: 25px; border-radius: 16px; }
    input, select, button { width: 100%; padding: 14px; margin: 8px 0; border-radius: 10px; background:#2a2a2a; color:white; border:1px solid #444; }
    button { background: #27ae60; color: white; border: none; cursor: pointer; font-weight: bold; }
    .btn-delete { background: #e74c3c; }
    .btn-daily { background: #ffcc00; color: #000; }
    table { width: 100%; border-collapse: collapse; margin-top: 15px; }
    th, td { padding: 14px; border-bottom: 1px solid #333; text-align: left; }
    th { background: #252525; }
    #btn-confirmar-corte { background: #2980b9; display: none; }
    #crop-wrapper {
      margin: 15px auto;
      width: 100%;
      max-width: 380px;
      min-height: 520px;
      max-height: 72vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #111;
      border-radius: 12px;
      border: 1px solid #333;
      overflow: hidden;
    }
    #imagePreview {
      max-width: 100% !important;
      max-height: 68vh !important;
      min-height: 480px !important;
      width: auto !important;
      height: auto !important;
      display: none;
      border: none !important;
      border-radius: 0 !important;
    }
    table img { width: 70px; height: 70px; object-fit: cover; border-radius: 8px; }
    .table-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }
    table td, table th { white-space: nowrap; }
    table td:nth-child(2), table td:nth-child(3) { white-space: normal; max-width: 180px; }
    .btn-edit { background: #2980b9; color: white; padding: 8px 14px; border: none; border-radius: 6px; margin-right: 6px; cursor: pointer; font-weight: bold; }

    /* Modal de edição */
    #edit-modal-overlay {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,0.75); z-index: 1000;
      align-items: center; justify-content: center;
    }
    #edit-modal-overlay.active { display: flex; }
    #edit-modal {
      background: #1a1a1a; border-radius: 16px; padding: 30px;
      width: 100%; max-width: 480px; position: relative;
    }
    #edit-modal h3 { margin: 0 0 18px; font-size: 1.1rem; }
    #edit-modal input, #edit-modal select { width: 100%; }
    #edit-modal .modal-actions { display: flex; gap: 10px; margin-top: 12px; }
    #edit-modal .modal-actions button { flex: 1; }
    #btn-close-modal {
      position: absolute; top: 14px; right: 16px;
      background: none; border: none; color: #aaa;
      font-size: 1.4rem; cursor: pointer; padding: 4px 8px;
      border-radius: 6px; width: auto;
    }
    #btn-close-modal:hover { color: #fff; background: #333; }
  </style>
</head>
<body>
  <div class="admin-panel">
    <div class="admin-header">
      <h1>Painel Administrativo — La Coccina</h1>
      <button onclick="toggleRestaurantStatus()" id="status-btn" style="padding:12px 25px; font-weight:bold;">
        🔄 Carregando...
      </button>
    </div>

    <div class="grid-admin">
      <div class="card-admin">
        <h2>+ Adicionar Novo Prato</h2>
        <input type="text" id="name" placeholder="Nome do prato">
        <input type="number" id="price" placeholder="Preço" step="0.01">
        <input type="text" id="desc" placeholder="Descrição">
        <select id="category" onchange="toggleDetailFields('category', 'detail-fields')">
          <option value="marmita">🍲 Marmita</option>
          <option value="bebida">🥤 Bebida</option>
        </select>

        <div id="detail-fields">
          <div id="fields-marmita">
            <input type="text" id="protein" placeholder="Proteína principal (ex: Frango, Carne, Peixe)">
            <input type="text" id="sides" placeholder="Acompanhamentos (ex: Arroz, Feijão, Salada)">
          </div>
          <div id="fields-bebida" style="display:none">
            <input type="text" id="volume" placeholder="Volume (ex: 350ml, 500ml, 1L)">
            <input type="text" id="serve_type" placeholder="Tipo de serviço (ex: Gelada, Natural, Quente)">
          </div>
        </div>

        <label>Foto do Prato:</label>
        <input type="file" id="imageUpload" accept="image/*" onchange="previewAndCrop(event)">

        <div id="crop-wrapper">
          <img id="imagePreview" alt="Pré-visualização para recorte">
        </div>

        <button id="btn-confirmar-corte" onclick="confirmarCorte()">✂️ Confirmar Corte</button>
        <button onclick="addProduct()">Adicionar Prato</button>
      </div>

      <div class="card-admin">
        <h2>Pratos Cadastrados</h2>
        <div class="table-scroll">
          <table id="products-table">
            <thead>
              <tr>
                <th>Imagem</th>
                <th>Prato</th>
                <th>Categoria</th>
                <th>Preço</th>
                <th>Ações</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal de edição de produto -->
  <div id="edit-modal-overlay" role="dialog" aria-modal="true" aria-labelledby="edit-modal-title">
    <div id="edit-modal">
      <button id="btn-close-modal" onclick="closeEditModal()" aria-label="Fechar" tabindex="0">✕</button>
      <h3 id="edit-modal-title">✏️ Editar Prato</h3>
      <input type="text" id="edit-name" placeholder="Nome do prato">
      <input type="number" id="edit-price" placeholder="Preço" step="0.01">
      <input type="text" id="edit-desc" placeholder="Descrição">
      <select id="edit-category" onchange="toggleDetailFields('edit-category', 'edit-detail-fields')">
        <option value="marmita">🍲 Marmita</option>
        <option value="bebida">🥤 Bebida</option>
      </select>

      <div id="edit-detail-fields">
        <div id="edit-fields-marmita">
          <input type="text" id="edit-protein" placeholder="Proteína principal (ex: Frango, Carne, Peixe)">
          <input type="text" id="edit-sides" placeholder="Acompanhamentos (ex: Arroz, Feijão, Salada)">
        </div>
        <div id="edit-fields-bebida" style="display:none">
          <input type="text" id="edit-volume" placeholder="Volume (ex: 350ml, 500ml, 1L)">
          <input type="text" id="edit-serve_type" placeholder="Tipo de serviço (ex: Gelada, Natural, Quente)">
        </div>
      </div>

      <small style="color:#888; display:block; margin-top:4px;">Deixe a imagem em branco para manter a atual.</small>
      <div class="modal-actions">
        <button onclick="saveEditProduct()" style="background:#27ae60;">💾 Salvar</button>
        <button onclick="closeEditModal()" style="background:#555; width:auto; padding: 14px 22px;">Cancelar</button>
      </div>
    </div>
  </div>

  <script src="../assets/js/config.js"></script>
  <script src="../assets/js/security.js"></script>
  <script>
    /* ==========================================================================
       PAINEL ADMIN — La Coccina
       ========================================================================== */
    const API_BASE = LaCoccinaSecurity.API_BASE;
    const esc = LaCoccinaSecurity.escapeHtml;
    const imgUrl = LaCoccinaSecurity.uploadUrl;
    let cropper = null;
    let croppedBlob = null;
    let editingProductId = null;

    function toggleDetailFields(selectId, containerId) {
      const cat = document.getElementById(selectId).value;
      const prefix = containerId === 'edit-detail-fields' ? 'edit-' : '';
      document.getElementById(`${prefix}fields-marmita`).style.display = cat === 'marmita' ? '' : 'none';
      document.getElementById(`${prefix}fields-bebida`).style.display  = cat === 'bebida'  ? '' : 'none';
    }

    function readDetails(prefix) {
      const cat = document.getElementById(`${prefix}category`).value;
      if (cat === 'marmita') {
        return {
          protein: document.getElementById(`${prefix}protein`).value.trim(),
          sides:   document.getElementById(`${prefix}sides`).value.trim(),
        };
      }
      return {
        volume:     document.getElementById(`${prefix}volume`).value.trim(),
        serve_type: document.getElementById(`${prefix}serve_type`).value.trim(),
      };
    }

    function fillDetailFields(prefix, category, details) {
      document.getElementById(`${prefix}category`).value = category;
      toggleDetailFields(`${prefix}category`, prefix === 'edit-' ? 'edit-detail-fields' : 'detail-fields');
      const d = details || {};
      if (category === 'marmita') {
        document.getElementById(`${prefix}protein`).value = d.protein || '';
        document.getElementById(`${prefix}sides`).value   = d.sides   || '';
      } else {
        document.getElementById(`${prefix}volume`).value     = d.volume     || '';
        document.getElementById(`${prefix}serve_type`).value = d.serve_type || '';
      }
    }

    function getAdminToken() {
      return sessionStorage.getItem('adminToken');
    }

    function logoutAdmin() {
      sessionStorage.removeItem('adminToken');
      localStorage.removeItem('adminLogged');
      window.location.href = 'login.html';
    }

    async function handleApiError(res, fallbackMsg) {
      let msg = fallbackMsg;
      try {
        const data = await res.json();
        if (data.error) msg = data.error;
      } catch { /* ignore */ }
      if (res.status === 401) {
        alert('Sessão expirada. Faça login novamente.');
        logoutAdmin();
        return;
      }
      alert(msg + ' (código ' + res.status + ')');
    }

    function apiFetch(url, options = {}) {
      const token = getAdminToken();
      if (!token) {
        logoutAdmin();
        return Promise.reject(new Error('Sem token de admin'));
      }
      const headers = { ...(options.headers || {}), Authorization: `Bearer ${token}` };
      return fetch(url, { ...options, headers });
    }

    if (!getAdminToken() || localStorage.getItem('adminLogged') !== 'true') {
      window.location.href = 'login.html';
    }

    function previewAndCrop(event) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = e => {
        const preview = document.getElementById('imagePreview');
        preview.src = e.target.result;
        preview.style.display = 'block';
        croppedBlob = null;
        if (cropper) cropper.destroy();
        cropper = new Cropper(preview, { aspectRatio: NaN, viewMode: 2 });
        document.getElementById('btn-confirmar-corte').style.display = 'block';
      };
      reader.readAsDataURL(file);
    }

    function confirmarCorte() {
      if (!cropper) return;
      cropper.getCroppedCanvas().toBlob(blob => {
        croppedBlob = blob;
        const preview = document.getElementById('imagePreview');
        cropper.destroy();
        cropper = null;
        preview.src = URL.createObjectURL(blob);
        document.getElementById('btn-confirmar-corte').style.display = 'none';
        alert('✅ Corte confirmado! Agora clique em "Adicionar Prato".');
      }, 'image/jpeg', 0.9);
    }

    async function addProduct() {
      const name = document.getElementById('name').value.trim();
      const price = document.getElementById('price').value.trim();
      const desc = document.getElementById('desc').value.trim();
      const category = document.getElementById('category').value;

      if (!name || !price) {
        alert('Preencha pelo menos o nome e o preço do prato.');
        return;
      }

      let imageUrl = '';

      if (croppedBlob) {
        const formData = new FormData();
        formData.append('image', croppedBlob, 'prato.jpg');
        try {
          const uploadRes = await apiFetch(`${API_BASE}/api/upload`, { method: 'POST', body: formData });
          const uploadData = await uploadRes.json();
          if (uploadData.imageUrl) {
            imageUrl = uploadData.imageUrl;
          } else {
            alert('Erro ao fazer upload da imagem.'); return;
          }
        } catch (e) {
          console.error('Erro no upload:', e);
          alert('Erro de conexão ao fazer upload da imagem.'); return;
        }
      }

      try {
        const res = await apiFetch(`${API_BASE}/api/products`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, price, desc, image: imageUrl, category, ...readDetails('') })
        });
        const data = await res.json();
        if (data.success) {
          alert('✅ Prato adicionado com sucesso!');
          document.getElementById('name').value = '';
          document.getElementById('price').value = '';
          document.getElementById('desc').value = '';
          document.getElementById('imageUpload').value = '';
          document.getElementById('imagePreview').style.display = 'none';
          croppedBlob = null;
          loadProducts();
        } else {
          alert('Erro ao adicionar prato.');
        }
      } catch (e) {
        console.error('Erro ao adicionar produto:', e);
        alert('Erro de conexão ao adicionar prato.');
      }
    }

    async function loadProducts() {
      try {
        const res = await apiFetch(`${API_BASE}/api/products/all`);
        if (!res.ok) {
          await handleApiError(res, 'Erro ao carregar produtos');
          return;
        }
        const products = await res.json();
        const tbody = document.querySelector('#products-table tbody');
        tbody.innerHTML = '';
        products.forEach(p => {
          const tr = document.createElement('tr');
          const d = p.details || {};
          const detailText = p.category === 'marmita'
            ? [d.protein, d.sides].filter(Boolean).join(' · ')
            : [d.volume, d.serve_type].filter(Boolean).join(' · ');
          tr.innerHTML = `
            <td><img src="${imgUrl(p.image)}" onerror="this.src='https://via.placeholder.com/70x70/333/fff?text=Sem+Foto'" width="70" height="70" alt=""></td>
            <td>
              ${esc(p.name)}
              ${detailText ? `<br><small style="color:#888">${esc(detailText)}</small>` : ''}
            </td>
            <td>${esc(p.category || '-')}</td>
            <td>R$ ${parseFloat(p.price).toFixed(2)}</td>
            <td>
              <button onclick="toggleActive(${p.id})" style="background:${p.active == 1 ? '#27ae60' : '#e74c3c'}; color:white; padding:8px 14px; border:none; border-radius:6px; margin-right:6px; cursor:pointer;">
                ${p.active == 1 ? '✅ Ativo' : '❌ Inativo'}
              </button>
              ${p.category === 'marmita' ? `
                <button onclick="toggleDailySpecial(${p.id}, ${p.isDailySpecial == 1})" style="background:#ffcc00; color:#000; padding:8px 14px; border:none; border-radius:6px; margin-right:6px; cursor:pointer;">
                  ${p.isDailySpecial == 1 ? '🌟 Remover do Dia' : '🌟 Prato do Dia'}
                </button>
              ` : ''}
              <button class="btn-edit"
                data-id="${p.id}"
                data-name="${esc(p.name)}"
                data-price="${p.price}"
                data-desc="${esc(p.desc || '')}"
                data-category="${esc(p.category)}"
                data-details="${esc(JSON.stringify(p.details || {}))}"
                onclick="openEditModalFromBtn(this)">✏️ Editar</button>
              <button onclick="deleteProduct(${p.id})" style="background:#e74c3c; color:white; padding:8px 14px; border:none; border-radius:6px; cursor:pointer;">Excluir</button>
            </td>
          `;
          tbody.appendChild(tr);
        });
      } catch (e) { console.error(e); }
    }

    async function toggleActive(id) {
      try {
        const res = await apiFetch(`${API_BASE}/api/products/toggle/${id}`, { method: 'PUT' });
        if (res.ok) { loadProducts(); return; }
        await handleApiError(res, 'Erro ao alterar status do prato');
      } catch (e) {
        if (e.message !== 'Sem token de admin') alert('Erro de conexão. Verifique se o servidor está rodando (node server.js).');
      }
    }

    async function toggleDailySpecial(id, isCurrentlyDaily) {
      try {
        const method = isCurrentlyDaily ? 'DELETE' : 'PUT';
        const res = await apiFetch(`${API_BASE}/api/products/daily/${id}`, { method });
        if (res.ok) { loadProducts(); return; }
        await handleApiError(res, isCurrentlyDaily ? 'Erro ao remover Prato do Dia' : 'Erro ao definir Prato do Dia');
      } catch (e) {
        if (e.message !== 'Sem token de admin') alert('Erro de conexão. Verifique se o servidor está rodando.');
      }
    }

    function openEditModalFromBtn(btn) {
      const ds = btn.dataset;
      editingProductId = Number(ds.id);
      const decode = s => s.replace(/&amp;/g, '&').replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&quot;/g, '"').replace(/&#39;/g, "'");
      document.getElementById('edit-name').value  = decode(ds.name);
      document.getElementById('edit-price').value = ds.price;
      document.getElementById('edit-desc').value  = decode(ds.desc);
      const category = decode(ds.category);
      const details  = JSON.parse(ds.details || '{}');
      fillDetailFields('edit-', category, details);
      document.getElementById('edit-modal-overlay').classList.add('active');
      document.getElementById('edit-name').focus();
    }

    function closeEditModal() {
      editingProductId = null;
      document.getElementById('edit-modal-overlay').classList.remove('active');
    }

    async function saveEditProduct() {
      if (!editingProductId) return;
      const name = document.getElementById('edit-name').value.trim();
      const price = document.getElementById('edit-price').value.trim();
      const desc = document.getElementById('edit-desc').value.trim();
      const category = document.getElementById('edit-category').value;

      if (!name || !price) {
        alert('Nome e preço são obrigatórios.');
        return;
      }

      try {
        const res = await apiFetch(`${API_BASE}/api/products/${editingProductId}`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, price, desc, category, image: '', ...readDetails('edit-') })
        });
        if (res.ok) {
          closeEditModal();
          loadProducts();
        } else {
          await handleApiError(res, 'Erro ao salvar edição');
        }
      } catch (e) {
        alert('Erro de conexão ao salvar edição.');
      }
    }

    document.getElementById('edit-modal-overlay').addEventListener('click', function(e) {
      if (e.target === this) closeEditModal();
    });

    document.addEventListener('keydown', function(e) {
      if (e.key === 'Escape') closeEditModal();
    });

    async function deleteProduct(id) {
      if (confirm("Excluir este prato?")) {
        const delRes = await apiFetch(`${API_BASE}/api/products/${id}`, { method: 'DELETE' });
        if (!delRes.ok) { alert('Erro ao excluir prato.'); return; }
        loadProducts();
      }
    }

    async function loadRestaurantStatus() {
      try {
        const res = await fetch(`${API_BASE}/api/products/status`);
        const data = await res.json();
        const btn = document.getElementById('status-btn');
        if (data.isOpen) {
          btn.textContent = '🟢 Restaurante ABERTO';
          btn.style.background = '#27ae60';
        } else {
          btn.textContent = '🔴 Restaurante FECHADO';
          btn.style.background = '#e74c3c';
        }
      } catch (e) {
        document.getElementById('status-btn').textContent = '⚠️ Sem conexão';
      }
    }

    async function toggleRestaurantStatus() {
      try {
        const res = await fetch(`${API_BASE}/api/products/status`);
        const data = await res.json();
        await apiFetch(`${API_BASE}/api/products/status`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ isOpen: !data.isOpen })
        });
        loadRestaurantStatus();
      } catch (e) {
        alert('Erro de conexão ao alterar status do restaurante.');
      }
    }

    window.onload = () => {
      loadProducts();
      loadRestaurantStatus();
    };
  </script>
</body>
</html>
