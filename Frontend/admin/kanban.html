<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>La Coccina — Kanban de Pedidos</title>
  <link rel="icon" type="image/png" sizes="32x32" href="../ASSETS/imagens/favicon-32.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' https: data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self';">
  <style>
    @font-face { font-family: 'SomeTimeLater'; src: url('../ASSETS/fonts/Some Time Later.otf') format('opentype'); }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #0d0d0d; color: #fff; font-family: 'Inter', sans-serif; min-height: 100vh; display: flex; flex-direction: column; }

    /* Header */
    .kb-header { background: #111; border-bottom: 1px solid #1e1e1e; padding: 12px 20px; display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; flex-shrink: 0; }
    .kb-brand { font-family: 'SomeTimeLater', cursive; font-size: 1.4rem; color: #ffcc00; }
    .kb-title { font-size: 0.72rem; color: #555; text-transform: uppercase; letter-spacing: 0.1em; margin-top: 1px; }
    .kb-header-right { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
    .kb-btn { background: #1a1a1a; border: 1px solid #2a2a2a; color: #ccc; border-radius: 8px; padding: 8px 14px; cursor: pointer; font-size: 0.82rem; font-weight: 500; white-space: nowrap; }
    .kb-btn:hover { border-color: #444; color: #fff; }
    .kb-btn.active { border-color: #ffcc00; color: #ffcc00; background: #1a1505; }
    .kb-badge { background: #e74c3c; color: #fff; border-radius: 50px; padding: 1px 7px; font-size: 0.7rem; font-weight: 700; margin-left: 4px; vertical-align: middle; }
    #kb-conn { font-size: 0.72rem; color: #555; display: flex; align-items: center; gap: 4px; }
    #kb-conn-dot { width: 7px; height: 7px; border-radius: 50%; background: #555; }
    #kb-conn-dot.connected { background: #27ae60; }

    /* Resumo de proteínas */
    #protein-summary { background: #111; border-bottom: 1px solid #1a1a1a; padding: 10px 20px; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; flex-shrink: 0; }
    .protein-chip { background: #1a1a1a; border: 1px solid #2a2a2a; border-radius: 50px; padding: 4px 12px; font-size: 0.78rem; color: #bbb; display: flex; align-items: center; gap: 6px; }
    .protein-chip strong { color: #ffcc00; font-size: 0.9rem; }
    #protein-summary .ps-label { font-size: 0.72rem; color: #444; text-transform: uppercase; letter-spacing: 0.08em; margin-right: 4px; }

    /* Board */
    .kb-board { display: flex; gap: 16px; padding: 16px 20px; flex: 1; overflow-x: auto; align-items: flex-start; }
    .kb-col { flex: 0 0 300px; display: flex; flex-direction: column; gap: 0; background: #111; border-radius: 14px; border: 1px solid #1e1e1e; overflow: hidden; min-height: 200px; }
    .kb-col-header { padding: 14px 16px 10px; display: flex; align-items: center; gap: 8px; border-bottom: 1px solid #1a1a1a; flex-shrink: 0; }
    .kb-col-title { font-size: 0.82rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.07em; flex: 1; }
    .kb-col-count { background: #2a2a2a; color: #888; border-radius: 50px; padding: 1px 8px; font-size: 0.72rem; font-weight: 600; }
    .kb-col-indicator { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
    .col-novo .kb-col-indicator      { background: #3498db; }
    .col-novo .kb-col-title           { color: #5dade2; }
    .col-em_producao .kb-col-indicator { background: #e67e22; }
    .col-em_producao .kb-col-title     { color: #eb9950; }
    .col-aguardando_envio .kb-col-indicator { background: #27ae60; }
    .col-aguardando_envio .kb-col-title     { color: #52be80; }
    .col-a_caminho .kb-col-indicator   { background: #9b59b6; }
    .col-a_caminho .kb-col-title       { color: #bb8fce; }

    .kb-col-body { padding: 10px; display: flex; flex-direction: column; gap: 10px; flex: 1; min-height: 100px; }
    .kb-col-body.drag-over { background: #1a1a1a; border-radius: 8px; }

    /* Card de pedido */
    .kb-card { background: #1a1a1a; border: 1px solid #2a2a2a; border-radius: 10px; padding: 14px; cursor: grab; transition: box-shadow 0.15s, transform 0.15s; user-select: none; }
    .kb-card:active { cursor: grabbing; }
    .kb-card.dragging { opacity: 0.4; transform: scale(0.97); }
    .kb-card:hover { border-color: #3a3a3a; box-shadow: 0 4px 16px rgba(0,0,0,0.4); }
    .kb-card-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; margin-bottom: 8px; }
    .kb-card-id { font-size: 0.68rem; color: #444; font-weight: 600; }
    .kb-card-time { font-size: 0.65rem; color: #444; white-space: nowrap; }
    .kb-card-name { font-size: 0.92rem; font-weight: 600; color: #eee; margin-bottom: 4px; }
    .kb-card-address { font-size: 0.75rem; color: #666; margin-bottom: 8px; line-height: 1.3; }
    .kb-card-items { display: flex; flex-direction: column; gap: 4px; margin-bottom: 10px; }
    .kb-card-item { font-size: 0.78rem; color: #aaa; display: flex; gap: 6px; align-items: flex-start; }
    .kb-card-item-qty { color: #ffcc00; font-weight: 700; flex-shrink: 0; }
    .kb-card-acc { font-size: 0.7rem; color: #555; margin-left: 18px; margin-top: 1px; }
    .kb-card-total { font-size: 0.82rem; color: #ffcc00; font-weight: 600; margin-bottom: 10px; }
    .kb-card-payment { font-size: 0.7rem; color: #555; margin-top: -8px; margin-bottom: 10px; }
    .kb-card-actions { display: flex; gap: 6px; flex-wrap: wrap; }
    .kb-card-actions button { border: none; border-radius: 6px; padding: 5px 10px; font-size: 0.72rem; font-weight: 600; cursor: pointer; }
    .btn-move-next { background: #ffcc00; color: #000; }
    .btn-move-next:hover { background: #ffd633; }
    .btn-cancel { background: #1a0a0a; color: #e74c3c; border: 1px solid #2a1010 !important; }
    .btn-cancel:hover { background: #2a0a0a; }
    .kb-card-obs { font-size: 0.72rem; color: #666; background: #141414; border-radius: 6px; padding: 6px 8px; margin-bottom: 8px; border-left: 2px solid #2a2a2a; }

    /* Empty state */
    .kb-empty { color: #333; font-size: 0.78rem; text-align: center; padding: 20px 10px; font-style: italic; }

    /* WhatsApp toggle */
    .kb-whatsapp-notice { background: #1a2a1a; border: 1px solid #2a4a2a; border-radius: 8px; padding: 8px 14px; font-size: 0.78rem; color: #4caf50; display: flex; align-items: center; gap: 8px; }
  </style>
</head>
<body>

<header class="kb-header">
  <div>
    <div class="kb-brand">La Coccina</div>
    <div class="kb-title">Kanban de Pedidos</div>
  </div>
  <div class="kb-header-right">
    <div class="kb-whatsapp-notice">
      📱 Modo WhatsApp ativo — pedidos chegam pelo WhatsApp e são movidos manualmente
    </div>
    <div id="kb-conn"><div id="kb-conn-dot"></div><span id="kb-conn-label">Conectando...</span></div>
    <a href="dashboard.html" class="kb-btn">← Painel</a>
  </div>
</header>

<div id="protein-summary">
  <span class="ps-label">Proteínas em produção:</span>
  <span id="protein-chips" style="color:#444; font-size:0.78rem">Carregando...</span>
</div>

<main class="kb-board" id="kb-board">
  <!-- Colunas renderizadas via JS -->
</main>

<script src="../ASSETS/js/config.js"></script>
<script src="../ASSETS/js/security.js"></script>
<script>
  const API = LaCoccinaSecurity.API_BASE;

  const COLUMNS = [
    { key: 'novo',             label: 'Novo Pedido',       nextLabel: 'Iniciar Produção',  nextKey: 'em_producao'      },
    { key: 'em_producao',      label: 'Em Produção',        nextLabel: 'Pronto p/ Envio',   nextKey: 'aguardando_envio' },
    { key: 'aguardando_envio', label: 'Aguardando Envio',   nextLabel: 'Saiu para Entrega', nextKey: 'a_caminho'        },
    { key: 'a_caminho',        label: 'A Caminho',          nextLabel: 'Marcar Entregue',   nextKey: 'entregue'         },
  ];

  let orders = [];
  let dragSrcId  = null;
  let dragSrcCol = null;
  let sseConn    = null;

  function getToken() { return sessionStorage.getItem('adminToken'); }
  function apiFetch(url, opts = {}) {
    const token = getToken();
    if (!token) { window.location.href = 'login.html'; return Promise.reject(); }
    return fetch(url, { ...opts, headers: { ...(opts.headers || {}), Authorization: `Bearer ${token}` } });
  }

  // ---- Carregar pedidos ----
  async function loadOrders() {
    try {
      const res = await apiFetch(`${API}/api/orders`);
      if (!res.ok) { if (res.status === 401) window.location.href = 'login.html'; return; }
      orders = await res.json();
      render();
    } catch (e) { console.error('Erro ao carregar pedidos:', e); }
  }

  // ---- Render board ----
  function render() {
    renderProteinSummary();
    const board = document.getElementById('kb-board');
    board.innerHTML = '';

    COLUMNS.forEach(col => {
      const colOrders = orders
        .filter(o => o.status === col.key)
        .sort((a, b) => a.kanban_order - b.kanban_order || new Date(a.created_at) - new Date(b.created_at));

      const colEl = document.createElement('div');
      colEl.className = `kb-col col-${col.key}`;
      colEl.dataset.col = col.key;
      colEl.innerHTML = `
        <div class="kb-col-header">
          <div class="kb-col-indicator"></div>
          <div class="kb-col-title">${col.label}</div>
          <div class="kb-col-count">${colOrders.length}</div>
        </div>
        <div class="kb-col-body" data-col="${col.key}">
          ${colOrders.length ? colOrders.map(o => renderCard(o, col)).join('') : '<div class="kb-empty">Nenhum pedido</div>'}
        </div>
      `;
      board.appendChild(colEl);

      // Drag & drop sobre a coluna
      const body = colEl.querySelector('.kb-col-body');
      body.addEventListener('dragover', onDragOver);
      body.addEventListener('drop',     e => onDrop(e, col.key));
      body.addEventListener('dragleave', e => e.currentTarget.classList.remove('drag-over'));
    });
  }

  function renderCard(o, col) {
    const items = Array.isArray(o.items) ? o.items : JSON.parse(o.items || '[]');
    const itemsHtml = items.map(i => {
      const acc = (i.accompaniments || []).map(a => a.name).join(', ');
      return `<div class="kb-card-item">
        <span class="kb-card-item-qty">${i.qty}×</span>
        <span>${esc(i.name)}</span>
      </div>${acc ? `<div class="kb-card-acc">↳ ${esc(acc)}</div>` : ''}`;
    }).join('');

    const elapsed = elapsedTime(o.created_at);
    const obsHtml = o.obs ? `<div class="kb-card-obs">📝 ${esc(o.obs)}</div>` : '';

    return `<div class="kb-card" draggable="true"
        data-id="${o.id}" data-col="${col.key}"
        ondragstart="onDragStart(event, ${o.id}, '${col.key}')"
        ondragend="onDragEnd(event)">
      <div class="kb-card-header">
        <span class="kb-card-id">#${o.id}</span>
        <span class="kb-card-time">${elapsed}</span>
      </div>
      <div class="kb-card-name">${esc(o.customer)}</div>
      <div class="kb-card-address">${esc(o.address || '')}</div>
      <div class="kb-card-items">${itemsHtml}</div>
      ${obsHtml}
      <div class="kb-card-total">R$ ${parseFloat(o.total).toFixed(2)}</div>
      <div class="kb-card-payment">${esc(o.payment || '').toUpperCase()}</div>
      <div class="kb-card-actions">
        ${col.nextKey ? `<button class="btn-move-next" onclick="moveOrder(${o.id}, '${col.nextKey}')">${col.nextLabel}</button>` : ''}
        <button class="btn-cancel" onclick="moveOrder(${o.id}, 'cancelado')">Cancelar</button>
      </div>
    </div>`;
  }

  function esc(s) { return LaCoccinaSecurity.escapeHtml(String(s ?? '')); }

  function elapsedTime(createdAt) {
    const diff = Math.floor((Date.now() - new Date(createdAt + 'Z').getTime()) / 60000);
    if (diff < 1)  return 'agora';
    if (diff < 60) return `${diff}min`;
    return `${Math.floor(diff / 60)}h${diff % 60 ? diff % 60 + 'min' : ''}`;
  }

  // ---- Resumo de proteínas ----
  function renderProteinSummary() {
    const active = orders.filter(o => ['novo', 'em_producao', 'aguardando_envio'].includes(o.status));
    const counts = {};
    active.forEach(o => {
      const items = Array.isArray(o.items) ? o.items : JSON.parse(o.items || '[]');
      items.forEach(i => {
        const name = String(i.name || '');
        // Extrair proteína do nome do item (heurística: primeira palavra)
        const protein = name.split(' ')[0] || name;
        counts[protein] = (counts[protein] || 0) + (i.qty || 1);
      });
    });

    const el = document.getElementById('protein-chips');
    if (!Object.keys(counts).length) { el.textContent = 'Sem pedidos ativos'; return; }
    el.innerHTML = Object.entries(counts)
      .sort((a, b) => b[1] - a[1])
      .map(([p, n]) => `<span class="protein-chip"><strong>${n}</strong> ${esc(p)}</span>`)
      .join('');
  }

  // ---- Mover pedido ----
  async function moveOrder(id, status) {
    const labels = { entregue: 'Marcar como entregue?', cancelado: 'Cancelar este pedido?' };
    if (labels[status] && !confirm(labels[status])) return;

    try {
      const res = await apiFetch(`${API}/api/orders/${id}/status`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ status }),
      });
      if (res.ok) {
        // Otimista: atualizar localmente
        const o = orders.find(x => x.id === id);
        if (o) o.status = status;
        if (['entregue', 'cancelado'].includes(status)) orders = orders.filter(x => x.id !== id);
        render();
      }
    } catch (e) { console.error('Erro ao mover pedido:', e); }
  }

  // ---- Drag & Drop ----
  function onDragStart(e, id, colKey) {
    dragSrcId  = id;
    dragSrcCol = colKey;
    e.dataTransfer.effectAllowed = 'move';
    setTimeout(() => e.target.classList.add('dragging'), 0);
  }

  function onDragEnd(e) {
    e.target.classList.remove('dragging');
    document.querySelectorAll('.kb-col-body').forEach(el => el.classList.remove('drag-over'));
  }

  function onDragOver(e) {
    e.preventDefault();
    e.dataTransfer.dropEffect = 'move';
    e.currentTarget.classList.add('drag-over');
  }

  async function onDrop(e, targetCol) {
    e.preventDefault();
    e.currentTarget.classList.remove('drag-over');
    if (dragSrcId === null) return;

    if (dragSrcCol !== targetCol) {
      // Mover para outra coluna
      await moveOrder(dragSrcId, targetCol);
    } else {
      // Reordenar dentro da mesma coluna (drop antes do card alvo)
      const colOrders = orders
        .filter(o => o.status === targetCol)
        .sort((a, b) => a.kanban_order - b.kanban_order);
      const fromIdx = colOrders.findIndex(o => o.id === dragSrcId);
      if (fromIdx === -1) return;
      const [moved] = colOrders.splice(fromIdx, 1);
      colOrders.push(moved); // simplificado: move para o fim; drop sobre card específico poderia ser mais preciso
      const ids = colOrders.map(o => o.id);
      colOrders.forEach((o, i) => { o.kanban_order = i; });
      render();
      try {
        await apiFetch(`${API}/api/orders/reorder`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ ids }),
        });
      } catch {}
    }
    dragSrcId = dragSrcCol = null;
  }

  // ---- SSE ----
  function connectSSE() {
    if (sseConn) sseConn.close();
    sseConn = new EventSource(`${API}/api/products/stream`);

    sseConn.onopen = () => {
      document.getElementById('kb-conn-dot').className = 'connected';
      document.getElementById('kb-conn-label').textContent = 'Ao vivo';
    };
    sseConn.onmessage = (e) => {
      try {
        const d = JSON.parse(e.data);
        if (['order-created', 'order-status-changed', 'menu-updated'].includes(d.type)) {
          loadOrders();
        }
      } catch {}
    };
    sseConn.onerror = () => {
      document.getElementById('kb-conn-dot').className = '';
      document.getElementById('kb-conn-label').textContent = 'Reconectando...';
      sseConn.close();
      setTimeout(connectSSE, 5000);
    };
  }

  // ---- Init ----
  if (!sessionStorage.getItem('adminToken') || localStorage.getItem('adminLogged') !== 'true') {
    window.location.href = 'login.html';
  } else {
    loadOrders();
    connectSSE();
    // Atualizar tempo decorrido a cada minuto
    setInterval(() => render(), 60000);
  }
</script>
</body>
</html>
